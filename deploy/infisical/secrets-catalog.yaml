# AegisPulse secret catalog (PROJECT.md §10.4 [secret] markers, §5.7; ADR-0012). Key NAMES and generators only, never
# values. Same folders/keys in both Infisical environments (Development → aegispulse-dev, Production → aegispulse).
# Consumers: the seeder (scripts/infisical/seed.py, MB-06) generates missing `generated` keys; Phase 9 renders one
# InfisicalSecret CR per runtime folder → Kubernetes Secret `aegispulse-{folder}-secrets`.
#
# generators:
#   hex24 / hex32 ... random hex of N bytes        strong ... mixed-case+digit+symbol (tools with password rules)
#   rsa2048-pem ..... RS256 private key (PEM)      b64-32 ... 32 random bytes, base64 (KEK)
#   mongo-keyfile ... 756 random bytes, base64     external . entered by its owner in the UI (never generated)
#   reference ....... composed with Infisical secret references to the owning folder (no new secret material)
version: 1
project: 16d178ac-eebb-4295-9243-b52b04ff3286
environments:
  dev: { name: Development, namespace: aegispulse-dev, slug: dev } # slug to confirm (MB-04)
  prod: { name: Production, namespace: aegispulse, slug: prod } # slug to confirm (MB-04)

folders:
  # ---------------- data stores (own the passwords) ----------------
  postgres:
    POSTGRES_ADMIN_PASSWORD: hex24
    PG_BACKUP_PASSWORD: hex24
    PG_MIG_PASSWORD_INGESTION: hex24
    PG_MIG_PASSWORD_FILES: hex24
    PG_MIG_PASSWORD_REGISTRY: hex24
    PG_MIG_PASSWORD_CASES: hex24
    PG_MIG_PASSWORD_ANALYTICS: hex24
    PG_SVC_PASSWORD_INGESTION: hex24
    PG_SVC_PASSWORD_FILES: hex24
    PG_SVC_PASSWORD_REGISTRY: hex24
    PG_SVC_PASSWORD_CASES: hex24
    PG_SVC_PASSWORD_ANALYTICS: hex24
  mongo:
    MONGO_ADMIN_PASSWORD: hex24
    MONGO_KEYFILE: mongo-keyfile
    MONGO_SVC_EVENTS_PASSWORD: hex24
    MONGO_MIG_EVENTS_PASSWORD: hex24
    MONGO_BACKUP_PASSWORD: hex24
  redis:
    REDIS_ADMIN_PASSWORD: hex24
    REDIS_PASSWORD_INGESTION: hex24
    REDIS_PASSWORD_FILES: hex24
    REDIS_PASSWORD_REGISTRY: hex24
    REDIS_PASSWORD_RISK_SCORING: hex24
  rabbitmq: # users on the shared cluster RabbitMQ (MB-09 creates them from these values)
    RABBITMQ_TOPOLOGY_PASSWORD: hex24
    RABBITMQ_PASSWORD_GATEWAY: hex24
    RABBITMQ_PASSWORD_INGESTION: hex24
    RABBITMQ_PASSWORD_FILES: hex24
    RABBITMQ_PASSWORD_EVENTS: hex24
    RABBITMQ_PASSWORD_ORCHESTRATOR: hex24
    RABBITMQ_PASSWORD_REGISTRY: hex24
    RABBITMQ_PASSWORD_CASES: hex24
    RABBITMQ_PASSWORD_DOC_EXTRACTION: hex24
    RABBITMQ_PASSWORD_DATA_INTEL: hex24
  objectstore:
    S3_ADMIN_ACCESS_KEY: hex24
    S3_ADMIN_SECRET_KEY: hex32
    S3_FILES_ACCESS_KEY: hex24
    S3_FILES_SECRET_KEY: hex32
    S3_INGESTION_ACCESS_KEY: hex24
    S3_INGESTION_SECRET_KEY: hex32
    S3_DOC_EXTRACTION_ACCESS_KEY: hex24
    S3_DOC_EXTRACTION_SECRET_KEY: hex32
    S3_EVENTS_ACCESS_KEY: hex24
    S3_EVENTS_SECRET_KEY: hex32
    S3_DATA_INTEL_ACCESS_KEY: hex24
    S3_DATA_INTEL_SECRET_KEY: hex32
    S3_BACKUP_ACCESS_KEY: hex24
    S3_BACKUP_SECRET_KEY: hex32
  observability:
    OTEL_EXPORTER_OTLP_HEADERS: external # OpenObserve ingestion token, "Authorization=Basic%20<b64>" (MB-10)

  # ---------------- runtimes (own secrets + composed connection strings) ----------------
  gateway:
    OTEL_EXPORTER_OTLP_HEADERS: reference # → observability
    SERVICE_CLIENT_SECRET: hex32 # FR-TEN-07 (used from Phase 2)
  ingestion:
    PG_PASSWORD: reference # → postgres.PG_SVC_PASSWORD_INGESTION
    AMQP_URL: reference # amqp://svc_ingestion[-dev]:<rabbitmq.RABBITMQ_PASSWORD_INGESTION>@rabbitmq…/aegispulse-{env}
    REDIS_URL: reference # → redis.REDIS_PASSWORD_INGESTION
    S3_ACCESS_KEY_ID: reference # → objectstore.S3_INGESTION_ACCESS_KEY
    S3_SECRET_ACCESS_KEY: reference # → objectstore.S3_INGESTION_SECRET_KEY
    INGESTION_KEK_BASE64: b64-32 # wraps webhook secret data keys (FR-WHK)
    SERVICE_CLIENT_SECRET: hex32
    OTEL_EXPORTER_OTLP_HEADERS: reference
  files:
    PG_PASSWORD: reference
    AMQP_URL: reference
    REDIS_URL: reference
    S3_ACCESS_KEY_ID: reference
    S3_SECRET_ACCESS_KEY: reference
    SERVICE_CLIENT_SECRET: hex32
    OTEL_EXPORTER_OTLP_HEADERS: reference
  events:
    MONGO_URI: reference # → mongo.MONGO_SVC_EVENTS_PASSWORD
    AMQP_URL: reference
    S3_ACCESS_KEY_ID: reference
    S3_SECRET_ACCESS_KEY: reference
    SERVICE_CLIENT_SECRET: hex32
    OTEL_EXPORTER_OTLP_HEADERS: reference
  registry:
    PG_PASSWORD: reference
    AMQP_URL: reference
    REDIS_URL: reference
    JWT_SIGNING_KEY_CURRENT_PEM: rsa2048-pem # FR-AUTH-05; public half published via JWKS
    JWT_SIGNING_KEY_PREVIOUS_PEM: external # set only during a rotation window (24 h)
    PLATFORM_ADMIN_BOOTSTRAP_EMAIL: external # FR-TEN-09; the operator's mailbox
    PLATFORM_ADMIN_BOOTSTRAP_PASSWORD: strong # FR-TEN-09; first login forces a change
    SERVICE_CLIENT_SECRET: hex32
    OTEL_EXPORTER_OTLP_HEADERS: reference
  cases:
    PG_PASSWORD: reference
    AMQP_URL: reference
    SERVICE_CLIENT_SECRET: hex32
    OTEL_EXPORTER_OTLP_HEADERS: reference
  risk-scoring:
    REDIS_URL: reference
    SERVICE_CLIENT_SECRET: hex32
    OTEL_EXPORTER_OTLP_HEADERS: reference
  sensitivity-scanner:
    ANTHROPIC_API_KEY: external # optional; only when SCANNER_LLM_ENABLED
    SERVICE_CLIENT_SECRET: hex32
    OTEL_EXPORTER_OTLP_HEADERS: reference
  doc-extraction:
    AMQP_URL: reference
    S3_ACCESS_KEY_ID: reference
    S3_SECRET_ACCESS_KEY: reference
    SERVICE_CLIENT_SECRET: hex32
    OTEL_EXPORTER_OTLP_HEADERS: reference
  data-intel:
    PG_PASSWORD: reference
    AMQP_URL: reference
    S3_ACCESS_KEY_ID: reference
    S3_SECRET_ACCESS_KEY: reference
    SERVICE_CLIENT_SECRET: hex32
    OTEL_EXPORTER_OTLP_HEADERS: reference
  orchestrator:
    AMQP_URL: reference
    NTFY_TOKEN: external # notification dispatch (FR-NOTIF)
    SERVICE_CLIENT_SECRET: hex32
    OTEL_EXPORTER_OTLP_HEADERS: reference
  scheduler-trigger:
    SERVICE_CLIENT_SECRET: hex32 # CronJobs call one internal action with a SERVICE token
