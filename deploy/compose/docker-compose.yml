# AegisPulse local stack (PROJECT.md §4.5, §10.3): infrastructure + the 12 application runtimes (Phase 1e skeletons). Secrets come from ../../.env
# (generated by scripts/dev/gen-local-secrets.sh or exported from Infisical env=local).
name: aegispulse

x-restart: &restart
  restart: unless-stopped

services:
  # ---------- config rendering (templates with __VAR__ tokens -> /rendered) ----------
  config-render:
    image: alpine:3.24.4
    env_file: ../../.env
    volumes:
      - ./init:/templates:ro
      - rendered:/rendered
    entrypoint: ["/bin/sh", "/templates/render.sh"]
    restart: "no"

  postgres:
    <<: *restart
    image: postgres:18.7-alpine
    env_file: ../../.env
    environment:
      POSTGRES_DB: aegispulse
      POSTGRES_USER: aegis_admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?run make env}
    volumes:
      - pgdata:/var/lib/postgresql
      - ./init/postgres:/docker-entrypoint-initdb.d:ro
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis_admin -d aegispulse"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 768m

  mongo:
    <<: *restart
    image: mongo:8.0.38
    env_file: ../../.env
    environment:
      MONGO_INITDB_ROOT_USERNAME: aegis_admin
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ADMIN_PASSWORD:?run make env}
    entrypoint:
      - bash
      - -c
      - |
        printf '%s' "$$MONGO_KEYFILE" > /tmp/keyfile && chmod 400 /tmp/keyfile && chown 999:999 /tmp/keyfile
        exec docker-entrypoint.sh mongod --replSet rs0 --bind_ip_all --keyFile /tmp/keyfile --wiredTigerCacheSizeGB 0.5
    volumes:
      - mongodata:/data/db
      - ./init/mongo/01-users.js:/docker-entrypoint-initdb.d/01-users.js:ro
    ports: ["27017:27017"]
    healthcheck:
      # Initiates the single-member replica set on first run (transactions need a replica set; PROJECT.md §5.6).
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet -u aegis_admin -p "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --eval
          "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok }" | grep -q 1
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s
    mem_limit: 1g

  redis:
    <<: *restart
    image: redis:8.10.3-alpine
    command: ["redis-server", "/rendered/redis/redis.conf"]
    volumes:
      - rendered:/rendered:ro
      - redisdata:/data
    ports: ["6379:6379"]
    depends_on:
      config-render: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --user healthcheck --pass healthcheck ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 256m

  rabbitmq:
    <<: *restart
    image: rabbitmq:4.4.1-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: aegis_admin
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_ADMIN_PASSWORD:?run make env}
    volumes:
      - rabbitdata:/var/lib/rabbitmq
    ports: ["5672:5672", "15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s
    mem_limit: 512m

  rabbitmq-init:
    image: curlimages/curl:8.23.0
    env_file: ../../.env
    volumes:
      - ./init/rabbitmq/init.sh:/init.sh:ro
    entrypoint: ["/bin/sh", "/init.sh"]
    depends_on:
      rabbitmq: { condition: service_healthy }
    restart: "no"

  objectstore:
    <<: *restart
    image: chrislusf/seaweedfs:4.54
    command:
      [
        "server",
        "-s3",
        "-s3.config=/rendered/objectstore/s3.json",
        "-dir=/data",
        "-volume.max=0",
        "-master.volumeSizeLimitMB=256",
      ]
    volumes:
      - rendered:/rendered:ro
      - objdata:/data
    ports: ["9000:8333"]
    depends_on:
      config-render: { condition: service_completed_successfully }
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1:8333/healthz || wget -q -S -O /dev/null http://127.0.0.1:8333/ 2>&1 | grep -q 'HTTP/'",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    mem_limit: 768m

  objectstore-init:
    image: python:3.13-alpine
    env_file: ../../.env
    volumes:
      - ./init/objectstore/buckets.py:/buckets.py:ro
      - pipcache:/root/.cache/pip
    entrypoint: ["/bin/sh", "-c", "pip install -q --disable-pip-version-check boto3==1.44.9 && python /buckets.py"]
    depends_on:
      objectstore: { condition: service_healthy }
    restart: "no"

  clamav:
    <<: *restart
    image: clamav/clamav:1.5.5-debian13-slim # multi-arch (amd64+arm64); plain tag is amd64-only
    environment:
      # FR-FILE-05/13: INSTREAM must accept the largest upload (512 MiB multipart; clamd defaults are 25M/100M/400M).
      CLAMD_CONF_StreamMaxLength: 520M
      CLAMD_CONF_MaxFileSize: 520M
      CLAMD_CONF_MaxScanSize: 520M
    ports: ["3310:3310"]
    volumes:
      - clamdb:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 300s # first start downloads signatures
    mem_limit: 1536m

  openobserve:
    <<: *restart
    image: openobserve/openobserve:v1.1.2
    environment:
      ZO_ROOT_USER_EMAIL: dev@aegispulse.local
      ZO_ROOT_USER_PASSWORD: ${OPENOBSERVE_LOCAL_PASSWORD:?run make env}
      ZO_DATA_DIR: /data
      # Fits the 512 MiB limit under the full stack's OTLP load: persist the in-memory WAL tables every 60 s (default
      # 600 s) and bound memtables (MB) and the query cache, otherwise ingestion fails with MemoryTableOverflowError.
      ZO_MAX_FILE_RETENTION_TIME: "60"
      ZO_MEM_TABLE_MAX_SIZE: "160"
      ZO_MEMORY_CACHE_MAX_SIZE: "96"
    volumes:
      - o2data:/data
    ports: ["5080:5080"]
    # Distroless image (no shell/curl): health is probed from the host by scripts/dev/compose-wait.sh.
    mem_limit: 512m

  # ---------- tools (profile: tools) — `make migrate` ----------
  migrate:
    profiles: [tools]
    build:
      context: ../..
      dockerfile: deploy/docker/migrate.Dockerfile
    env_file: ../../.env
    environment:
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_DATABASE: aegispulse
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  # FR-TEN-09: first PLATFORM_ADMIN (idempotent). `docker compose --profile tools run --rm registry-bootstrap`
  registry-bootstrap:
    profiles: [tools]
    image: aegispulse-registry:local
    command: ["bootstrap-platform-admin"]
    environment:
      AEGIS_ENV: local
      LOG_LEVEL: ${LOG_LEVEL:-info}
      OTEL_SDK_DISABLED: "true"
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_DATABASE: aegispulse
      PG_USER: svc_registry
      PG_PASSWORD: ${PG_SVC_PASSWORD_REGISTRY:?run make env}
      AMQP_URL: amqp://svc_registry:${RABBITMQ_PASSWORD_REGISTRY:?run make env}@rabbitmq:5672/aegispulse-local
      REDIS_URL: redis://registry:${REDIS_PASSWORD_REGISTRY:?run make env}@redis:6379/0
      REGISTRY_URL: http://registry:8084
      JWT_ISSUER: aegispulse-registry
      JWT_AUDIENCE: aegispulse
      PLATFORM_ADMIN_BOOTSTRAP_EMAIL: admin@aegispulse.local
      PLATFORM_ADMIN_BOOTSTRAP_PASSWORD: ${PLATFORM_ADMIN_BOOTSTRAP_PASSWORD:-} # empty → exit 2 naming the variable (scripts/dev/ensure-local-vars.sh)
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    restart: "no"

  # scheduler-trigger (§5.1 CronJobs locally): `make trigger JOB=<job>` — one SERVICE-token call, then exit.
  scheduler-trigger:
    profiles: [tools]
    image: aegispulse-scheduler-trigger:local
    build:
      context: ../..
      dockerfile: deploy/docker/node-service.Dockerfile
      args:
        SERVICE: scheduler-trigger
        MAX_OLD_SPACE_MB: 64
        GIT_SHA: ${GIT_SHA:-dev}
    environment:
      AEGIS_ENV: local
      LOG_LEVEL: ${LOG_LEVEL:-info}
      OTEL_SDK_DISABLED: "true"
      REGISTRY_URL: http://registry:8084
      INGESTION_URL: http://ingestion:8081
      FILES_URL: http://files:8082
      SERVICE_CLIENT_ID: svc-scheduler-trigger
      SERVICE_CLIENT_SECRET: ${SERVICE_CLIENT_SECRET_SCHEDULER_TRIGGER:-} # empty → exit 2 naming the variable
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    restart: "no"

  # ---------- application runtimes (Phase 1e skeletons; PROJECT.md §5.4) ----------
  # Each runtime gets only its own credentials (interpolated from ../../.env), runs non-root with a read-only root FS
  # (tmpfs /tmp), drops all capabilities, and is probed from the host on 127.0.0.1:<port>/readyz by compose-wait.sh.

  gateway:
    <<: *restart
    image: aegispulse-gateway:local
    build:
      context: ../..
      dockerfile: deploy/docker/node-service.Dockerfile
      args:
        SERVICE: gateway
        GIT_SHA: ${GIT_SHA:-dev}
    environment:
      AEGIS_ENV: local
      LOG_LEVEL: ${LOG_LEVEL:-info}
      OTEL_SERVICE_NAMESPACE: aegispulse
      OTEL_EXPORTER_OTLP_ENDPOINT: http://openobserve:5080/api/default
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      REGISTRY_URL: http://registry:8084
      JWT_ISSUER: aegispulse-registry
      JWT_AUDIENCE: aegispulse
      # svc-gateway SERVICE credentials (§5.7.4): the same .env value the registry reconciles (ADR-0017)
      SERVICE_CLIENT_ID: svc-gateway
      SERVICE_CLIENT_SECRET: ${SERVICE_CLIENT_SECRET_GATEWAY:-}
    ports: ["127.0.0.1:8080:8080"]
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 384m

  ingestion:
    <<: *restart
    image: aegispulse-ingestion:local
    build:
      context: ../..
      dockerfile: deploy/docker/node-service.Dockerfile
      args:
        SERVICE: ingestion
        GIT_SHA: ${GIT_SHA:-dev}
    environment:
      AEGIS_ENV: local
      LOG_LEVEL: ${LOG_LEVEL:-info}
      OTEL_SERVICE_NAMESPACE: aegispulse
      OTEL_EXPORTER_OTLP_ENDPOINT: http://openobserve:5080/api/default
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_DATABASE: aegispulse
      PG_USER: svc_ingestion
      PG_PASSWORD: ${PG_SVC_PASSWORD_INGESTION:?run make env}
      AMQP_URL: amqp://svc_ingestion:${RABBITMQ_PASSWORD_INGESTION:?run make env}@rabbitmq:5672/aegispulse-local
      REDIS_URL: redis://ingestion:${REDIS_PASSWORD_INGESTION:?run make env}@redis:6379/0
      S3_ENDPOINT: http://objectstore:8333
      S3_REGION: us-east-1
      S3_FORCE_PATH_STYLE: "true"
      S3_ACCESS_KEY_ID: ${S3_INGESTION_ACCESS_KEY:?run make env}
      S3_SECRET_ACCESS_KEY: ${S3_INGESTION_SECRET_KEY:?run make env}
      S3_BUCKET_PREFIX: aegispulse-local
      REGISTRY_URL: http://registry:8084
      JWT_ISSUER: aegispulse-registry
      JWT_AUDIENCE: aegispulse
      SERVICE_CLIENT_ID: svc-ingestion
      SERVICE_CLIENT_SECRET: ${SERVICE_CLIENT_SECRET_INGESTION:-}
      # FR-WHK-01 KEK (empty → ingestion refuses to start, naming the variable); scripts/dev/ensure-local-vars.sh
      INGESTION_KEK_BASE64: ${INGESTION_KEK_BASE64:-}
      INGESTION_KEK_VERSION: "1"
    ports: ["127.0.0.1:8081:8081"]
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }
      objectstore: { condition: service_healthy }
    mem_limit: 384m

  files:
    <<: *restart
    image: aegispulse-files:local
    build:
      context: ../..
      dockerfile: deploy/docker/node-service.Dockerfile
      args:
        SERVICE: files
        GIT_SHA: ${GIT_SHA:-dev}
    environment:
      AEGIS_ENV: local
      LOG_LEVEL: ${LOG_LEVEL:-info}
      OTEL_SERVICE_NAMESPACE: aegispulse
      OTEL_EXPORTER_OTLP_ENDPOINT: http://openobserve:5080/api/default
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_DATABASE: aegispulse
      PG_USER: svc_files
      PG_PASSWORD: ${PG_SVC_PASSWORD_FILES:?run make env}
      AMQP_URL: amqp://svc_files:${RABBITMQ_PASSWORD_FILES:?run make env}@rabbitmq:5672/aegispulse-local
      REDIS_URL: redis://files:${REDIS_PASSWORD_FILES:?run make env}@redis:6379/0
      S3_ENDPOINT: http://objectstore:8333
      S3_REGION: us-east-1
      S3_FORCE_PATH_STYLE: "true"
      S3_ACCESS_KEY_ID: ${S3_FILES_ACCESS_KEY:?run make env}
      S3_SECRET_ACCESS_KEY: ${S3_FILES_SECRET_KEY:?run make env}
      S3_BUCKET_PREFIX: aegispulse-local
      FILES_AV_ENABLED: "true"
      CLAMAV_HOST: clamav
      # FR-FILE-01: presigned URLs name the host clients reach (objectstore's published port), §10.4.
      PUBLIC_OBJECTS_URL: http://localhost:9000
      # FR-FILE-13 on locally so the 200 MiB multipart E2E runs (§10.4 default false; dev/prod set it explicitly).
      MULTIPART_UPLOADS_ENABLED: "true"
      REGISTRY_URL: http://registry:8084
      JWT_ISSUER: aegispulse-registry
      JWT_AUDIENCE: aegispulse
      SERVICE_CLIENT_ID: svc-files
      SERVICE_CLIENT_SECRET: ${SERVICE_CLIENT_SECRET_FILES:-}
    ports: ["127.0.0.1:8082:8082"]
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }
      objectstore: { condition: service_healthy }
    mem_limit: 384m

  events:
    <<: *restart
    image: aegispulse-events:local
    build:
      context: ../..
      dockerfile: deploy/docker/node-service.Dockerfile
      args:
        SERVICE: events
        MAX_OLD_SPACE_MB: 384
        GIT_SHA: ${GIT_SHA:-dev}
    environment:
      AEGIS_ENV: local
      LOG_LEVEL: ${LOG_LEVEL:-info}
      OTEL_SERVICE_NAMESPACE: aegispulse
      OTEL_EXPORTER_OTLP_ENDPOINT: http://openobserve:5080/api/default
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      AMQP_URL: amqp://svc_events:${RABBITMQ_PASSWORD_EVENTS:?run make env}@rabbitmq:5672/aegispulse-local
      MONGO_URI: mongodb://svc_events:${MONGO_SVC_EVENTS_PASSWORD:?run make env}@mongo:27017/aegispulse_events?replicaSet=rs0&authSource=admin
      S3_ENDPOINT: http://objectstore:8333
      S3_REGION: us-east-1
      S3_FORCE_PATH_STYLE: "true"
      S3_ACCESS_KEY_ID: ${S3_EVENTS_ACCESS_KEY:?run make env}
      S3_SECRET_ACCESS_KEY: ${S3_EVENTS_SECRET_KEY:?run make env}
      S3_BUCKET_PREFIX: aegispulse-local
      REGISTRY_URL: http://registry:8084
      JWT_ISSUER: aegispulse-registry
      JWT_AUDIENCE: aegispulse
      SERVICE_CLIENT_ID: svc-events
      SERVICE_CLIENT_SECRET: ${SERVICE_CLIENT_SECRET_EVENTS:-}
    ports: ["127.0.0.1:8083:8083"]
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      mongo: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      objectstore: { condition: service_healthy }
    mem_limit: 512m

  registry:
    <<: *restart
    image: aegispulse-registry:local
    build:
      context: ../..
      dockerfile: deploy/docker/java-service.Dockerfile
      args:
        SERVICE: registry
        GIT_SHA: ${GIT_SHA:-dev}
    environment:
      AEGIS_ENV: local
      LOG_LEVEL: ${LOG_LEVEL:-info}
      OTEL_SERVICE_NAMESPACE: aegispulse
      OTEL_EXPORTER_OTLP_ENDPOINT: http://openobserve:5080/api/default
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_SERVICE_NAME: aegispulse-registry
      OTEL_LOGS_EXPORTER: none
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_DATABASE: aegispulse
      PG_USER: svc_registry
      PG_PASSWORD: ${PG_SVC_PASSWORD_REGISTRY:?run make env}
      AMQP_URL: amqp://svc_registry:${RABBITMQ_PASSWORD_REGISTRY:?run make env}@rabbitmq:5672/aegispulse-local
      REDIS_URL: redis://registry:${REDIS_PASSWORD_REGISTRY:?run make env}@redis:6379/0
      REGISTRY_URL: http://registry:8084
      JWT_ISSUER: aegispulse-registry
      JWT_AUDIENCE: aegispulse
      # FR-AUTH-05 signing key (empty → registry refuses to start, naming the variable); scripts/dev/ensure-local-vars.sh
      JWT_SIGNING_KEY_CURRENT_PEM: ${JWT_SIGNING_KEY_CURRENT_PEM:-}
      JWT_SIGNING_KEY_CURRENT_KID: local-2026-11
      # ADR-0017: one secret per SERVICE account; the same .env value is given to that runtime (Phase 2c wiring)
      SERVICE_CLIENT_SECRET_GATEWAY: ${SERVICE_CLIENT_SECRET_GATEWAY:-}
      SERVICE_CLIENT_SECRET_INGESTION: ${SERVICE_CLIENT_SECRET_INGESTION:-}
      SERVICE_CLIENT_SECRET_FILES: ${SERVICE_CLIENT_SECRET_FILES:-}
      SERVICE_CLIENT_SECRET_EVENTS: ${SERVICE_CLIENT_SECRET_EVENTS:-}
      SERVICE_CLIENT_SECRET_ORCHESTRATOR: ${SERVICE_CLIENT_SECRET_ORCHESTRATOR:-}
      SERVICE_CLIENT_SECRET_DOC_EXTRACTION: ${SERVICE_CLIENT_SECRET_DOC_EXTRACTION:-}
      SERVICE_CLIENT_SECRET_RISK_SCORING: ${SERVICE_CLIENT_SECRET_RISK_SCORING:-}
      SERVICE_CLIENT_SECRET_DATA_INTEL: ${SERVICE_CLIENT_SECRET_DATA_INTEL:-}
      SERVICE_CLIENT_SECRET_SCHEDULER_TRIGGER: ${SERVICE_CLIENT_SECRET_SCHEDULER_TRIGGER:-}
    ports: ["127.0.0.1:8084:8084"]
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }
    mem_limit: 768m

  cases:
    <<: *restart
    image: aegispulse-cases:local
    build:
      context: ../..
      dockerfile: deploy/docker/java-service.Dockerfile
      args:
        SERVICE: cases
        GIT_SHA: ${GIT_SHA:-dev}
    environment:
      AEGIS_ENV: local
      LOG_LEVEL: ${LOG_LEVEL:-info}
      OTEL_SERVICE_NAMESPACE: aegispulse
      OTEL_EXPORTER_OTLP_ENDPOINT: http://openobserve:5080/api/default
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_SERVICE_NAME: aegispulse-cases
      OTEL_LOGS_EXPORTER: none
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_DATABASE: aegispulse
      PG_USER: svc_cases
      PG_PASSWORD: ${PG_SVC_PASSWORD_CASES:?run make env}
      AMQP_URL: amqp://svc_cases:${RABBITMQ_PASSWORD_CASES:?run make env}@rabbitmq:5672/aegispulse-local
      REGISTRY_URL: http://registry:8084
      JWT_ISSUER: aegispulse-registry
      JWT_AUDIENCE: aegispulse
    ports: ["127.0.0.1:8085:8085"]
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    mem_limit: 768m

  risk-scoring:
    <<: *restart
    image: aegispulse-risk-scoring:local
    build:
      context: ../..
      dockerfile: deploy/docker/python-service.Dockerfile
      args:
        SERVICE: risk-scoring
        MODULE: aegis_risk.main:app
        PORT: 8086
        GIT_SHA: ${GIT_SHA:-dev}
    environment:
      AEGIS_ENV: local
      LOG_LEVEL: ${LOG_LEVEL:-info}
      OTEL_SERVICE_NAMESPACE: aegispulse
      OTEL_EXPORTER_OTLP_ENDPOINT: http://openobserve:5080/api/default
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      REDIS_URL: redis://risk_scoring:${REDIS_PASSWORD_RISK_SCORING:?run make env}@redis:6379/0
    ports: ["127.0.0.1:8086:8086"]
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      redis: { condition: service_healthy }
    mem_limit: 512m

  sensitivity-scanner:
    <<: *restart
    image: aegispulse-sensitivity-scanner:local
    build:
      context: ../..
      dockerfile: deploy/docker/python-service.Dockerfile
      args:
        SERVICE: sensitivity-scanner
        MODULE: aegis_scanner.main:app
        PORT: 8087
        GIT_SHA: ${GIT_SHA:-dev}
    environment:
      AEGIS_ENV: local
      LOG_LEVEL: ${LOG_LEVEL:-info}
      OTEL_SERVICE_NAMESPACE: aegispulse
      OTEL_EXPORTER_OTLP_ENDPOINT: http://openobserve:5080/api/default
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
    ports: ["127.0.0.1:8087:8087"]
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g

  doc-extraction:
    <<: *restart
    image: aegispulse-doc-extraction:local
    build:
      context: ../..
      dockerfile: deploy/docker/python-service.Dockerfile
      args:
        SERVICE: doc-extraction
        MODULE: aegis_extract.main:app
        PORT: 8088
        GIT_SHA: ${GIT_SHA:-dev}
    environment:
      AEGIS_ENV: local
      LOG_LEVEL: ${LOG_LEVEL:-info}
      OTEL_SERVICE_NAMESPACE: aegispulse
      OTEL_EXPORTER_OTLP_ENDPOINT: http://openobserve:5080/api/default
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      AMQP_URL: amqp://svc_doc_extraction:${RABBITMQ_PASSWORD_DOC_EXTRACTION:?run make env}@rabbitmq:5672/aegispulse-local
    ports: ["127.0.0.1:8088:8088"]
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      rabbitmq: { condition: service_healthy }
    mem_limit: 1536m

  data-intel:
    <<: *restart
    image: aegispulse-data-intel:local
    build:
      context: ../..
      dockerfile: deploy/docker/python-service.Dockerfile
      args:
        SERVICE: data-intel
        MODULE: aegis_intel.main:app
        PORT: 8089
        GIT_SHA: ${GIT_SHA:-dev}
    environment:
      AEGIS_ENV: local
      LOG_LEVEL: ${LOG_LEVEL:-info}
      OTEL_SERVICE_NAMESPACE: aegispulse
      OTEL_EXPORTER_OTLP_ENDPOINT: http://openobserve:5080/api/default
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_DATABASE: aegispulse
      PG_USER: svc_analytics
      PG_PASSWORD: ${PG_SVC_PASSWORD_ANALYTICS:?run make env}
      AMQP_URL: amqp://svc_data_intel:${RABBITMQ_PASSWORD_DATA_INTEL:?run make env}@rabbitmq:5672/aegispulse-local
      S3_ENDPOINT: http://objectstore:8333
      S3_REGION: us-east-1
      S3_FORCE_PATH_STYLE: "true"
      S3_ACCESS_KEY_ID: ${S3_DATA_INTEL_ACCESS_KEY:?run make env}
      S3_SECRET_ACCESS_KEY: ${S3_DATA_INTEL_SECRET_KEY:?run make env}
      S3_BUCKET_PREFIX: aegispulse-local
    ports: ["127.0.0.1:8089:8089"]
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      objectstore: { condition: service_healthy }
    mem_limit: 768m

  orchestrator:
    <<: *restart
    image: aegispulse-orchestrator:local
    build:
      context: ../..
      dockerfile: deploy/docker/node-service.Dockerfile
      args:
        SERVICE: orchestrator
        MAX_OLD_SPACE_MB: 192
        GIT_SHA: ${GIT_SHA:-dev}
    environment:
      AEGIS_ENV: local
      LOG_LEVEL: ${LOG_LEVEL:-info}
      OTEL_SERVICE_NAMESPACE: aegispulse
      OTEL_EXPORTER_OTLP_ENDPOINT: http://openobserve:5080/api/default
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      AMQP_URL: amqp://svc_orchestrator:${RABBITMQ_PASSWORD_ORCHESTRATOR:?run make env}@rabbitmq:5672/aegispulse-local
    ports: ["127.0.0.1:8090:8090"]
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      rabbitmq: { condition: service_healthy }
    mem_limit: 256m

  console:
    <<: *restart
    image: aegispulse-console:local
    build:
      context: ../..
      dockerfile: deploy/docker/console.Dockerfile
    ports: ["127.0.0.1:8091:8080"]
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 64m

volumes:
  rendered: {}
  pgdata: {}
  mongodata: {}
  redisdata: {}
  rabbitdata: {}
  objdata: {}
  clamdb: {}
  o2data: {}
  pipcache: {}
