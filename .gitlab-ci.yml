# AegisPulse pipeline (PROJECT.md §9.2). Phase 0 skeleton: .pre, lint, test.
# Later phases add contract, build, scan, sign, deploy-dev, verify-dev, deploy-prod, verify-prod, release.
# Logic lives in ci/*.sh (cluster standard K3S_CONTEXT §3.2); keep this file declarative.
stages: [.pre, lint, test, contract]

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" # MR pipelines
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS # branch with an open MR: the MR pipeline covers it
      when: never
    - if: $CI_COMMIT_BRANCH # main, feature branches without an MR, schedules, web runs
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

default:
  tags: [default, generic]
  interruptible: true

variables:
  GIT_DEPTH: "0" # full history for gitleaks + migration immutability checks

.node: &node
  image: node:24.22.3-alpine3.24
  before_script:
    - apk add --no-cache bash git
    - corepack enable pnpm
  cache:
    key: { files: [pnpm-lock.yaml] }
    paths: [.pnpm-store]

.python: &python
  image: ghcr.io/astral-sh/uv:0.13.9-python3.13-trixie-slim
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends git >/dev/null
  cache:
    key: { files: [uv.lock] }
    paths: [.cache/uv]
  variables:
    UV_CACHE_DIR: .cache/uv

.java: &java
  image: eclipse-temurin:25-jdk-noble
  cache:
    key: { files: [gradle/wrapper/gradle-wrapper.properties, gradle/libs.versions.toml] }
    paths: [.gradle-home]
  variables:
    GRADLE_USER_HOME: .gradle-home

gitleaks:
  stage: .pre
  image: { name: zricethezav/gitleaks:v8.30.1, entrypoint: [""] }
  script: [apk add --no-cache bash >/dev/null, ./ci/scan-gitleaks.sh]

lint:shell:
  stage: lint
  image: koalaman/shellcheck-alpine:v0.11.0
  script: [apk add --no-cache bash git >/dev/null, ./ci/lint-shell.sh]

lint:node:
  <<: *node
  stage: lint
  script: [./ci/lint-node.sh]

lint:python:
  <<: *python
  stage: lint
  script: [./ci/lint-python.sh]

lint:java:
  <<: *java
  stage: lint
  script: [./ci/lint-java.sh]

check:guardrails:
  <<: *python
  stage: lint
  script:
    - ./ci/check-boundaries.sh
    - ./ci/check-migrations.sh
    - ./ci/check-resource-budget.sh
    - ./ci/tests/run.sh

test:node:
  <<: *node
  stage: test
  script: [./ci/test-node.sh]

test:python:
  <<: *python
  stage: test
  script: [./ci/test-python.sh]

test:java:
  <<: *java
  stage: test
  script: [./ci/test-java.sh]

contract:
  <<: *node
  stage: contract
  before_script:
    - apk add --no-cache bash git curl
    - corepack enable pnpm
    - curl -LsSf https://astral.sh/uv/0.13.9/install.sh | env UV_INSTALL_DIR=/usr/local/bin sh
  script: [./ci/contract.sh]
