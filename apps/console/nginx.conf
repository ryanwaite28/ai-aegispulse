# Console static server (PROJECT.md §5.4: nginx-unprivileged, port 8080). Phase 1e placeholder; Phase 19 serves the
# Vite build with SPA fallback. Security headers per NFR-08 (HSTS is set at Cloudflare).
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Frame-Options "DENY" always;

  location = /livez { access_log off; default_type application/json; return 200 '{"status":"ok"}'; }
  location = /readyz { access_log off; default_type application/json; return 200 '{"ready":true}'; }
  location = /healthz { default_type application/json; return 200 '{"ready":true}'; }
  location / { try_files $uri /index.html; }
}
