# Node workspaces (PROJECT.md §6.1). Members are added as their directories are created (Phase 1+).
packages:
  - "gateway/*"
  - "services/ingestion"
  - "services/files"
  - "services/events"
  - "services/orchestrator"
  - "workers/*"
  - "packages/ts-platform"
  - "packages/contracts"
  - "apps/*"
  - "scripts"
  - "tests"
# Only esbuild (tsx/vitest) may run install scripts; everything else is denied (supply-chain hygiene).
allowBuilds:
  "@scarf/scarf": false
  cpu-features: false
  esbuild: true
  protobufjs: false
  ssh2: false
