# Java version catalog (pinned after verifying current releases; docs/steering/tech.md).
[versions]
spring-boot = "4.2.0"
flyway = "11.20.3"
testcontainers-java = "2.0.5"
errorprone = "2.53.0"
nullaway = "0.14.4"
google-java-format = "2.0.0"
jspecify = "1.0.1"
json-schema-validator = "3.0.9"
archunit = "1.5.1"
otel-javaagent = "2.34.0"
password4j = "1.8.4"
nbvcxz = "1.5.1"

[libraries]
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }
nullaway = { module = "com.uber.nullaway:nullaway", version.ref = "nullaway" }
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
json-schema-validator = { module = "com.networknt:json-schema-validator", version.ref = "json-schema-validator" }
archunit = { module = "com.tngtech.archunit:archunit", version.ref = "archunit" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
password4j = { module = "com.password4j:password4j", version.ref = "password4j" }
nbvcxz = { module = "me.gosimple:nbvcxz", version.ref = "nbvcxz" }
otel-javaagent = { module = "io.opentelemetry.javaagent:opentelemetry-javaagent", version.ref = "otel-javaagent" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
errorprone = { id = "net.ltgt.errorprone", version = "5.2.0" }
spotless = { id = "com.diffplug.spotless", version = "8.12.0" }
