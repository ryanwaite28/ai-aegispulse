# risk-scoring (PROJECT.md §6.1): features + scoring (§2.12, FR-TXN). Phase 1e: skeleton (config, logs, traces, probes).
[project]
name = "risk-scoring"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = ["aegis-platform", "aegis-contracts", "uvicorn==0.54.0", "redis==8.1.0"]

[tool.uv.sources]
aegis-platform = { workspace = true }
aegis-contracts = { workspace = true }

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aegis_risk"]
