# cases configuration (PROJECT.md §6.9, §10.4): environment variables only; nothing environment-specific here.
# Platform defaults (logs, probes, confirms, no runtime declaration) come from java-platform at lowest precedence.
spring:
  application:
    name: cases
  config:
    import: optional:file:/app/build-info.properties # aegis.version=<git sha>, written by the image build
  datasource:
    url: jdbc:postgresql://${PG_HOST}:${PG_PORT:5432}/${PG_DATABASE}
    username: ${PG_USER}
    password: ${PG_PASSWORD}
    hikari:
      maximum-pool-size: 10
  rabbitmq:
    addresses: ${AMQP_URL}

server:
  port: 8085

logging:
  level:
    root: ${LOG_LEVEL:info}

aegis:
  service: cases
  version: dev
  env: ${AEGIS_ENV}
  security:
    jwk-set-uri: ${REGISTRY_URL}/.well-known/jwks.json
    issuer: ${JWT_ISSUER}
    audience: ${JWT_AUDIENCE}
  readiness:
    schema: cases
    min-flyway-version: "2"
  outbox:
    schema: cases
