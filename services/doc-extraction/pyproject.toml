# doc-extraction (PROJECT.md §6.1): consumer + parsing/NER/clauses (§2.7). Phase 1e: skeleton (config, logs, traces, probes).
[project]
name = "doc-extraction"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = ["aegis-platform", "aegis-contracts", "uvicorn==0.54.0"]

[tool.uv.sources]
aegis-platform = { workspace = true }
aegis-contracts = { workspace = true }

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aegis_extract"]
