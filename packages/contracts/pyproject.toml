# aegis-contracts: generated Pydantic v2 models, topology enums and contract schemas (make contracts).
# A uv workspace member so Python services and py-platform import `aegis_contracts`. Never hand-edit generated/.
[project]
name = "aegis-contracts"
version = "1.1.0"
description = "AegisPulse wire contracts for Python (generated)."
requires-python = ">=3.13,<3.14"
dependencies = ["pydantic==2.14.4"]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["generated/python/aegis_contracts"]
