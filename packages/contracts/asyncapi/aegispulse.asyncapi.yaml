    messages:
      external.regulatory.published:
        $ref: "#/components/messages/external.regulatory.published"
    bindings:
      amqp:
        is: routingKey
        exchange:
          name: aegispulse.ingress
          type: topic
          durable: true
          autoDelete: false
          vhost: /
        bindingVersion: 0.3.0
