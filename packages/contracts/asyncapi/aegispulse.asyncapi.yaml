  schemas:
    AmqpHeaders:
      type: object
      required:
        - traceparent
      properties:
        traceparent:
          type: string
          description: W3C trace context.
        tracestate:
          type: string
        x-aegis-tenant:
          type: string
          description: Tenant UUID (informational routing/logging header).
        x-aegis-schema-version:
          type: string
          pattern: ^1\.[0-9]+\.[0-9]+$
        x-retry-count:
          type: integer
          minimum: 0
        x-aegis-replay-job:
          type: string
          description: Present on replayed messages (FR-RPL-02).
        x-aegis-replay-generation:
          type: integer
          minimum: 0
        x-aegis-error-code:
          type: string
          description: DLQ messages only.
        x-aegis-original-queue:
          type: string
          description: DLQ messages only.
x-aegis-topology-note:
  exchanges:
    topic_durable:
      - aegispulse.ingress
      - aegispulse.enrichment
      - aegispulse.domain
      - aegispulse.intelligence
    direct:
      - aegispulse.retry
      - aegispulse.dlx
  retry: Consumers retry by republishing to aegispulse.retry with routing key {queue}.retry.{tier} and x-retry-count+1; retry queues are classic TTL queues dead-lettering back to {queue} (§5.5, §6.5).
  dlx: "Dead letters are published to aegispulse.dlx with routing key {queue}; {queue}.dlq is bound with {queue}; events.deadletter.q is bound with # (FR-MSG-02). DLQ messages carry x-aegis-error-code and x-aegis-original-queue."
  notModelled:
    - "events.deadletter.q (dlx → #, internal dead-letter registry; not a business event key)"
    - cases.enrichment-timer.q (delayed self-messages via aegispulse.retry, routing cases.enrichment-timeout; not a catalogued event)
  notificationRequested: notification.requested is published on aegispulse.domain, aegispulse.enrichment or aegispulse.intelligence depending on the emitter; the channel binding names domain and x-aegis-exchanges lists all three.
