asyncapi: 3.0.0
info:
  title: AegisPulse Events
  version: 1.1.0
  description: "AegisPulse RabbitMQ event contracts (single source of truth: [PROJECT.md §6.4–§6.7](../../../PROJECT.md)). Canonical envelope and AMQP properties: PROJECT.md §6.4. Topology and consumer kit: §6.5 and §5.5. Event catalog: §6.7. Envelope schemaVersion 1.1.0; payload schemas in ../events/. AMQP properties: messageId = eventId, correlationId, type = eventType, contentType = application/json, deliveryMode = 2, timestamp."
defaultContentType: application/json
servers:
  local:
    host: rabbitmq:5672
    protocol: amqp
    protocolVersion: 0.9.1
    pathname: /aegispulse-local
    description: Docker Compose broker (AMQP_URL=amqp://svc_<runtime>:<secret>@rabbitmq:5672/aegispulse-local).
  dev:
    host: rabbitmq.rabbitmq.svc:5672
    protocol: amqp
    protocolVersion: 0.9.1
    pathname: /aegispulse-dev
    description: Shared homelab k3s broker (namespace `rabbitmq`), vhost aegispulse-dev. Host is in-cluster only.
  prod:
    host: rabbitmq.rabbitmq.svc:5672
    protocol: amqp
    protocolVersion: 0.9.1
    pathname: /aegispulse-prod
    description: Shared homelab k3s broker (namespace `rabbitmq`), vhost aegispulse-prod. Host is in-cluster only.
