openapi: 3.1.0
info:
  title: AegisPulse Ingestion internal API
  version: 1.0.0
  description: |-
    Internal RPC contract for services/ingestion (Node 24 / Fastify): webhook ingestion, webhook sources, connectors and transaction intake. Operations are POST /internal/v1/{action}; operationId equals the ServiceAction name (PROJECT.md §6.2).

    All operations are `POST /internal/v1/{actionName}` (uniform RPC style) and return the success envelope `{ data, meta }` (PROJECT.md §8.2). Caller allowlists follow PROJECT.md §5.7.4; the service re-verifies the JWT, role and tenant ownership itself (FR-AUTH-06).
servers:
  - url: http://{host}:8081
    description: In-cluster Service (PROJECT.md §5.4 port).
    variables:
      host:
        default: aegispulse-ingestion
tags:
  - name: ingestion
    description: AegisPulse Ingestion internal API
security:
  - bearerJwt: []
x-aegis-consumer-actions: []
paths:
  /internal/v1/ingestWebhookDelivery:
    post:
      operationId: ingestWebhookDelivery
      summary: Verify and ingest a webhook delivery
      description: |-
        Called with the gateway SERVICE token (no user token exists yet). Order: source lookup, signature (HMAC-SHA256 over {timestamp}.{deliveryId}.{rawBody}, constant-time, current and previous secret), timestamp skew <= 300 s, replay guard, then schema validation (422 only after signature verification).

        Internal action `ingestion.ingestWebhookDelivery`. Requires a JWT: the user token forwarded by the gateway, or a SERVICE token (aud=aegispulse-internal) whose `act[]` includes `ingestWebhookDelivery`.
      tags:
        - ingestion
      security:
        - bearerJwt: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngestWebhookDeliveryInput"
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    $ref: "#/components/schemas/WebhookAccepted"
                  meta:
                    $ref: ./components/common.yaml#/components/schemas/SuccessMeta
        "400":
          $ref: ./components/common.yaml#/components/responses/BadRequest
        "401":
          $ref: ./components/common.yaml#/components/responses/Unauthorized
        "403":
          $ref: ./components/common.yaml#/components/responses/Forbidden
        "404":
          $ref: ./components/common.yaml#/components/responses/NotFound
        "409":
          $ref: ./components/common.yaml#/components/responses/Conflict
        "413":
          $ref: ./components/common.yaml#/components/responses/PayloadTooLarge
        "422":
          $ref: ./components/common.yaml#/components/responses/ValidationError
        "500":
          $ref: ./components/common.yaml#/components/responses/InternalError
        "503":
          $ref: ./components/common.yaml#/components/responses/DependencyUnavailable
      x-aegis-allowed-callers:
        - gateway
      x-aegis-fr:
        - FR-WHK-02
        - FR-WHK-03
        - FR-WHK-04
        - FR-WHK-05
      x-aegis-error-codes:
        - WEBHOOK_SOURCE_NOT_FOUND
        - WEBHOOK_SIGNATURE_INVALID
        - WEBHOOK_TIMESTAMP_SKEW
        - WEBHOOK_REPLAY_DETECTED
        - PAYLOAD_TOO_LARGE
        - TENANT_SUSPENDED
        - UNAUTHORIZED
        - FORBIDDEN
        - BAD_REQUEST
        - VALIDATION_ERROR
        - INTERNAL_ERROR
        - DEPENDENCY_UNAVAILABLE
