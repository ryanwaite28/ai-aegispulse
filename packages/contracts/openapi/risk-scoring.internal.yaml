openapi: 3.1.0
info:
  title: AegisPulse Risk Scoring internal API
  version: 1.0.0
  description: |-
    Internal RPC contract for services/risk-scoring (Python 3.13 / FastAPI). Operations are POST /internal/v1/{action}; operationId equals the ServiceAction name (PROJECT.md §6.2).

    All operations are `POST /internal/v1/{actionName}` (uniform RPC style) and return the success envelope `{ data, meta }` (PROJECT.md §8.2). Caller allowlists follow PROJECT.md §5.7.4; the service re-verifies the JWT, role and tenant ownership itself (FR-AUTH-06).
servers:
  - url: http://{host}:8086
    description: In-cluster Service (PROJECT.md §5.4 port).
    variables:
      host:
        default: aegispulse-risk-scoring
tags:
  - name: risk-scoring
    description: AegisPulse Risk Scoring internal API
security:
  - bearerJwt: []
x-aegis-consumer-actions: []
paths:
  /internal/v1/score:
    post:
      operationId: score
      summary: Score a transaction
      description: |-
        Computes features and the score per PROJECT.md §1.4.4 (risk-heuristic-v1.0.0). Callers apply a 2 s timeout with a circuit breaker. FR-TXN-04 names the route POST /v1/score; this contract uses the uniform internal convention.

        Internal action `riskScoring.score`. Requires a JWT: the user token forwarded by the gateway, or a SERVICE token (aud=aegispulse-internal) whose `act[]` includes `score`.
      tags:
        - risk-scoring
      security:
        - bearerJwt: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScoreRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    $ref: "#/components/schemas/ScoreResponse"
                  meta:
                    $ref: ./components/common.yaml#/components/schemas/SuccessMeta
        "400":
          $ref: ./components/common.yaml#/components/responses/BadRequest
        "401":
          $ref: ./components/common.yaml#/components/responses/Unauthorized
        "403":
          $ref: ./components/common.yaml#/components/responses/Forbidden
        "422":
          $ref: ./components/common.yaml#/components/responses/ValidationError
        "500":
          $ref: ./components/common.yaml#/components/responses/InternalError
        "503":
          $ref: ./components/common.yaml#/components/responses/DependencyUnavailable
      x-aegis-allowed-callers:
        - orchestrator
      x-aegis-fr:
        - FR-TXN-04
      x-aegis-error-codes:
        - UNAUTHORIZED
        - FORBIDDEN
        - BAD_REQUEST
        - VALIDATION_ERROR
        - INTERNAL_ERROR
        - DEPENDENCY_UNAVAILABLE
components:
  securitySchemes:
    bearerJwt:
      $ref: ./components/common.yaml#/components/securitySchemes/bearerJwt
  schemas:
    ScoreRequest:
      type: object
      additionalProperties: false
      properties:
        tenantId:
          $ref: ./components/common.yaml#/components/schemas/Uuid
        eventId:
          $ref: ./components/common.yaml#/components/schemas/Uuid
        accountId:
          type: string
          minLength: 1
          maxLength: 64
        counterpartyId:
          type: string
          minLength: 1
          maxLength: 64
        amount:
          type: string
          pattern: ^(?=.*[1-9])[0-9]{1,18}\.[0-9]{2,4}$
          description: Decimal string.
        currency:
          type: string
          pattern: ^[A-Z]{3}$
        country:
          type: string
          pattern: ^[A-Z]{2}$
        channel:
          type: string
          enum:
            - WIRE
            - ACH
            - CARD
            - CRYPTO
            - INTERNAL
        occurredAt:
          $ref: ./components/common.yaml#/components/schemas/IsoDateTime
        metadata:
          type: object
          additionalProperties: true
          description: metadata.demoScenario = FORCE_CRITICAL applies only when tenantSettings.demoMode is true.
        watchlistHit:
          type: boolean
          description: True when the counterparty resolves to an entity on an ACTIVE tenant watchlist (saga checkWatchlists step) (adds the watchlist_factor of 20, PROJECT.md §1.4.4).
        tenantSettings:
          type: object
          additionalProperties: false
          properties:
            highValueThresholdUsd:
              type: string
              pattern: ^[0-9]{1,18}(\.[0-9]{1,4})?$
              description: Decimal string.
            highRiskCountries:
              type: array
              items:
                type: string
                pattern: ^[A-Z]{2}$
            demoMode:
              type: boolean
          required:
            - highValueThresholdUsd
            - highRiskCountries
            - demoMode
          description: Supplied by the caller (orchestrator, via getTenantSettings) because risk-scoring has no callee permissions (PROJECT.md §5.7.4).
      required:
        - tenantId
        - eventId
        - accountId
        - counterpartyId
        - amount
        - currency
        - country
        - occurredAt
        - watchlistHit
        - tenantSettings
      description: Inputs of the heuristic in PROJECT.md §1.4.4. Feature updates are idempotent by eventId (FR-TXN-04).
    ScoreResponse:
      type: object
      properties:
        score:
          type: integer
          minimum: 0
          maximum: 100
        band:
          type: string
          enum:
            - LOW
            - MEDIUM
            - HIGH
            - CRITICAL
          description: LOW < 40, MEDIUM 40-69, HIGH 70-84, CRITICAL >= 85.
        factors:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              value:
                type: number
              contribution:
                type: number
            required:
              - name
              - value
              - contribution
        modelVersion:
          type: string
        featureVersion:
          type: string
        computedAt:
          $ref: ./components/common.yaml#/components/schemas/IsoDateTime
      required:
        - score
        - band
        - factors
        - modelVersion
        - featureVersion
        - computedAt
