openapi: 3.1.0
info:
  title: AegisPulse Public API
  version: 1.0.0
  summary: Public HTTP contract of gateway/nest-http (PROJECT.md §8).
  description: |-
    Public contract served by the gateway (NestJS on Fastify). JSON responses use the envelope `{ data, meta }` / `{ error, meta }` (PROJECT.md §8.2). List endpoints use cursor pagination (`limit` 1-100 default 25, `cursor`; next page in `meta.nextCursor`). Mutations accept an optional `Idempotency-Key` header (<= 128 chars).

    Roles: PLATFORM_ADMIN (PA), TENANT_ADMIN (TA), ANALYST (AN), VIEWER (VI), COMPLIANCE_AUDITOR (CA), INTEGRATION (IN). Notation in `x-aegis-roles` is expanded: "VI+" = VIEWER, ANALYST, TENANT_ADMIN, PLATFORM_ADMIN; "AN+" = ANALYST, TENANT_ADMIN, PLATFORM_ADMIN; "IN/AN+" adds INTEGRATION. COMPLIANCE_AUDITOR is outside that ladder and is listed only where PROJECT.md grants it. PLATFORM_ADMIN may act on a specific tenant via `X-Aegis-Tenant` (audited, FR-AUTH-06). Cross-tenant access returns 404, not 403.

    Extensions: `x-aegis-roles`, `x-aegis-backing-action` (service actions the gateway calls, PROJECT.md §6.2), `x-aegis-fr`, `x-aegis-error-codes`, `x-aegis-gaps`.
servers:
  - url: http://localhost:8080
    description: local
  - url: https://aegispulse-api.rmwhs-dev.space
    description: dev (homelab k3s, namespace aegispulse-dev)
  - url: https://aegispulse-api.rmwhs.com
    description: prod (homelab k3s, namespace aegispulse)
tags:
  - name: Auth
    description: Authentication and JWKS (registry).
  - name: Tenants
    description: Tenant lifecycle and settings (registry).
  - name: Users
    description: User management (registry).
  - name: ServiceAccounts
    description: INTEGRATION service accounts (registry).
  - name: Entities
    description: Tracked entities (registry).
  - name: Watchlists
    description: Watchlists (registry).
  - name: Webhooks
    description: Webhook ingestion and sources (ingestion).
  - name: Connectors
    description: Connector pollers (ingestion).
  - name: Transactions
    description: Transaction intake (ingestion + cases composition).
  - name: Files
    description: File upload and retrieval (files).
  - name: Events
    description: Event archive and classification (events).
  - name: Replay
    description: Event replay jobs (events).
  - name: Cases
    description: Risk cases (cases).
  - name: Audit
    description: Immutable audit log (cases).
  - name: Intelligence
    description: Data intelligence (data-intel).
  - name: Ops
    description: Dead-letter operations (events).
  - name: Streaming
    description: Server-Sent Events (gateway).
  - name: Health
    description: Probes.
security:
  - bearerJwt: []
paths:
  /v1/auth/login:
    post:
      operationId: login
      summary: Log in
      description: Tenant slug + email + password. Returns an RS256 access JWT (15 min) and a rotating refresh token (7 d). Limited to 5 failed attempts per (tenant, email) per 15 min. Responses never reveal whether the email exists.
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./registry.internal.yaml#/components/schemas/LoginInput
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    $ref: ./registry.internal.yaml#/components/schemas/TokenPair
                  meta:
                    $ref: ./components/common.yaml#/components/schemas/SuccessMeta
        "400":
          $ref: ./components/common.yaml#/components/responses/BadRequest
        "401":
          $ref: ./components/common.yaml#/components/responses/Unauthorized
        "403":
          $ref: ./components/common.yaml#/components/responses/Forbidden
        "413":
          $ref: ./components/common.yaml#/components/responses/PayloadTooLarge
        "422":
          $ref: ./components/common.yaml#/components/responses/ValidationError
        "429":
          $ref: ./components/common.yaml#/components/responses/RateLimited
        "500":
          $ref: ./components/common.yaml#/components/responses/InternalError
        "503":
          $ref: ./components/common.yaml#/components/responses/DependencyUnavailable
      x-aegis-roles: []
      x-aegis-backing-action:
        - registry.login
      x-aegis-fr:
        - FR-AUTH-01
      x-aegis-error-codes:
        - AUTH_INVALID_CREDENTIALS
        - AUTH_RATE_LIMITED
        - TENANT_SUSPENDED
        - DEPENDENCY_UNAVAILABLE
        - INTERNAL_ERROR
        - RATE_LIMITED
        - BAD_REQUEST
        - VALIDATION_ERROR
        - PAYLOAD_TOO_LARGE
  /v1/auth/refresh:
    post:
      operationId: refreshToken
      summary: Rotate the refresh token
      description: The presented token is invalidated; reuse of an invalidated token revokes the whole family.
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./registry.internal.yaml#/components/schemas/RefreshTokenInput
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    $ref: ./registry.internal.yaml#/components/schemas/TokenPair
                  meta:
                    $ref: ./components/common.yaml#/components/schemas/SuccessMeta
        "400":
          $ref: ./components/common.yaml#/components/responses/BadRequest
        "401":
          $ref: ./components/common.yaml#/components/responses/Unauthorized
        "403":
          $ref: ./components/common.yaml#/components/responses/Forbidden
        "413":
          $ref: ./components/common.yaml#/components/responses/PayloadTooLarge
        "422":
          $ref: ./components/common.yaml#/components/responses/ValidationError
        "429":
          $ref: ./components/common.yaml#/components/responses/RateLimited
        "500":
          $ref: ./components/common.yaml#/components/responses/InternalError
        "503":
          $ref: ./components/common.yaml#/components/responses/DependencyUnavailable
      x-aegis-roles: []
      x-aegis-backing-action:
        - registry.refreshToken
      x-aegis-fr:
        - FR-AUTH-02
      x-aegis-error-codes:
        - AUTH_REFRESH_INVALID
        - TENANT_SUSPENDED
        - DEPENDENCY_UNAVAILABLE
        - INTERNAL_ERROR
        - RATE_LIMITED
        - BAD_REQUEST
        - VALIDATION_ERROR
        - PAYLOAD_TOO_LARGE
  /v1/auth/logout:
    post:
      operationId: logout
      summary: Log out
      description: Revokes the current refresh-token family.
      tags:
        - Auth
      security:
        - bearerJwt: []
      parameters:
        - $ref: ./components/common.yaml#/components/parameters/XAegisTenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./registry.internal.yaml#/components/schemas/LogoutInput
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    $ref: ./components/common.yaml#/components/schemas/Ack
                  meta:
                    $ref: ./components/common.yaml#/components/schemas/SuccessMeta
        "400":
          $ref: ./components/common.yaml#/components/responses/BadRequest
        "401":
          $ref: ./components/common.yaml#/components/responses/Unauthorized
        "403":
          $ref: ./components/common.yaml#/components/responses/Forbidden
        "413":
          $ref: ./components/common.yaml#/components/responses/PayloadTooLarge
        "422":
          $ref: ./components/common.yaml#/components/responses/ValidationError
        "429":
          $ref: ./components/common.yaml#/components/responses/RateLimited
        "500":
          $ref: ./components/common.yaml#/components/responses/InternalError
        "503":
          $ref: ./components/common.yaml#/components/responses/DependencyUnavailable
      x-aegis-roles:
        - PLATFORM_ADMIN
        - TENANT_ADMIN
        - ANALYST
        - VIEWER
        - COMPLIANCE_AUDITOR
        - INTEGRATION
      x-aegis-backing-action:
        - registry.logout
      x-aegis-fr:
        - FR-AUTH-03
      x-aegis-error-codes:
        - UNAUTHORIZED
        - FORBIDDEN
        - DEPENDENCY_UNAVAILABLE
        - INTERNAL_ERROR
        - RATE_LIMITED
        - BAD_REQUEST
        - VALIDATION_ERROR
        - PAYLOAD_TOO_LARGE
  /v1/auth/password:
    post:
      operationId: changePassword
      summary: Change password
      description: Revokes all other refresh-token families.
      tags:
        - Auth
      security:
        - bearerJwt: []
      parameters:
        - $ref: ./components/common.yaml#/components/parameters/XAegisTenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./registry.internal.yaml#/components/schemas/ChangePasswordInput
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    $ref: ./components/common.yaml#/components/schemas/Ack
                  meta:
                    $ref: ./components/common.yaml#/components/schemas/SuccessMeta
        "400":
          $ref: ./components/common.yaml#/components/responses/BadRequest
        "401":
          $ref: ./components/common.yaml#/components/responses/Unauthorized
        "403":
          $ref: ./components/common.yaml#/components/responses/Forbidden
        "413":
          $ref: ./components/common.yaml#/components/responses/PayloadTooLarge
        "422":
          $ref: ./components/common.yaml#/components/responses/ValidationError
        "429":
          $ref: ./components/common.yaml#/components/responses/RateLimited
        "500":
          $ref: ./components/common.yaml#/components/responses/InternalError
        "503":
          $ref: ./components/common.yaml#/components/responses/DependencyUnavailable
      x-aegis-roles:
        - PLATFORM_ADMIN
        - TENANT_ADMIN
        - ANALYST
        - VIEWER
        - COMPLIANCE_AUDITOR
      x-aegis-backing-action:
        - registry.changePassword
      x-aegis-fr:
        - FR-AUTH-07
      x-aegis-error-codes:
        - AUTH_PASSWORD_POLICY
        - AUTH_INVALID_CREDENTIALS
        - UNAUTHORIZED
        - FORBIDDEN
        - DEPENDENCY_UNAVAILABLE
        - INTERNAL_ERROR
        - RATE_LIMITED
        - BAD_REQUEST
        - VALIDATION_ERROR
        - PAYLOAD_TOO_LARGE
  /v1/auth/me:
    get:
      operationId: getCurrentPrincipal
      summary: Get the current principal
      tags:
        - Auth
      security:
        - bearerJwt: []
      parameters:
        - $ref: ./components/common.yaml#/components/parameters/XAegisTenant
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    $ref: ./registry.internal.yaml#/components/schemas/Principal
                  meta:
                    $ref: ./components/common.yaml#/components/schemas/SuccessMeta
        "401":
          $ref: ./components/common.yaml#/components/responses/Unauthorized
        "403":
          $ref: ./components/common.yaml#/components/responses/Forbidden
        "429":
          $ref: ./components/common.yaml#/components/responses/RateLimited
        "500":
          $ref: ./components/common.yaml#/components/responses/InternalError
        "503":
          $ref: ./components/common.yaml#/components/responses/DependencyUnavailable
      x-aegis-roles:
        - PLATFORM_ADMIN
        - TENANT_ADMIN
        - ANALYST
        - VIEWER
        - COMPLIANCE_AUDITOR
        - INTEGRATION
      x-aegis-backing-action:
        - registry.getCurrentPrincipal
      x-aegis-fr:
        - FR-AUTH-03
      x-aegis-error-codes:
        - UNAUTHORIZED
        - FORBIDDEN
        - DEPENDENCY_UNAVAILABLE
        - INTERNAL_ERROR
        - RATE_LIMITED
  /v1/auth/token:
    post:
      operationId: issueClientCredentialsToken
      summary: Issue a client-credentials token
      description: INTEGRATION service accounts authenticate with clientId and clientSecret (no bearer). TTL 15 min, no refresh token. The audience is fixed to aegispulse on this public route.
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IssueClientCredentialsTokenRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    $ref: ./registry.internal.yaml#/components/schemas/AccessToken
                  meta:
                    $ref: ./components/common.yaml#/components/schemas/SuccessMeta
        "400":
          $ref: ./components/common.yaml#/components/responses/BadRequest
        "401":
          $ref: ./components/common.yaml#/components/responses/Unauthorized
        "403":
          $ref: ./components/common.yaml#/components/responses/Forbidden
        "413":
          $ref: ./components/common.yaml#/components/responses/PayloadTooLarge
        "422":
          $ref: ./components/common.yaml#/components/responses/ValidationError
        "429":
          $ref: ./components/common.yaml#/components/responses/RateLimited
        "500":
          $ref: ./components/common.yaml#/components/responses/InternalError
        "503":
          $ref: ./components/common.yaml#/components/responses/DependencyUnavailable
      x-aegis-roles:
        - INTEGRATION
      x-aegis-backing-action:
        - registry.issueClientCredentialsToken
      x-aegis-fr:
        - FR-AUTH-04
      x-aegis-error-codes:
        - AUTH_INVALID_CREDENTIALS
        - TENANT_SUSPENDED
        - DEPENDENCY_UNAVAILABLE
        - INTERNAL_ERROR
        - RATE_LIMITED
        - BAD_REQUEST
        - VALIDATION_ERROR
        - PAYLOAD_TOO_LARGE
  /.well-known/jwks.json:
    get:
      operationId: getJwks
      summary: Get public signing keys (JWKS)
      description: Current and previous signing keys (kid rotation every 90 days; previous key retained 24 h). Returned as a bare RFC 7517 JWK Set, not wrapped in the {data, meta} envelope, so standard JWT libraries can consume it. Served by the Registry as a non-action endpoint.
      tags:
        - Auth
      security: []
      responses:
        "200":
          description: JWK Set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Jwks"
        "429":
          $ref: ./components/common.yaml#/components/responses/RateLimited
        "500":
          $ref: ./components/common.yaml#/components/responses/InternalError
        "503":
          $ref: ./components/common.yaml#/components/responses/DependencyUnavailable
      x-aegis-roles: []
      x-aegis-backing-action:
        - registry (non-action endpoint /.well-known/jwks.json)
      x-aegis-fr:
        - FR-AUTH-05
      x-aegis-error-codes:
        - DEPENDENCY_UNAVAILABLE
        - INTERNAL_ERROR
        - RATE_LIMITED
  /v1/openapi.json:
    get:
      operationId: getOpenApiDocument
      summary: Get the public OpenAPI document
      description: Served from packages/contracts — contracts-first, ADR-0013.
      tags:
        - Health
      security: []
      responses:
        "200":
          description: Bundled public OpenAPI document.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "429":
          $ref: ./components/common.yaml#/components/responses/RateLimited
        "500":
          $ref: ./components/common.yaml#/components/responses/InternalError
        "503":
          $ref: ./components/common.yaml#/components/responses/DependencyUnavailable
      x-aegis-roles: []
      x-aegis-backing-action: []
      x-aegis-fr: []
      x-aegis-error-codes:
        - DEPENDENCY_UNAVAILABLE
        - INTERNAL_ERROR
        - RATE_LIMITED
  /v1/tenants:
    post:
      operationId: createTenant
      summary: Create a tenant
      tags:
        - Tenants
      security:
        - bearerJwt: []
      parameters:
        - $ref: ./components/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./registry.internal.yaml#/components/schemas/CreateTenantInput
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    $ref: ./registry.internal.yaml#/components/schemas/Tenant
                  meta:
                    $ref: ./components/common.yaml#/components/schemas/SuccessMeta
        "400":
          $ref: ./components/common.yaml#/components/responses/BadRequest
        "401":
          $ref: ./components/common.yaml#/components/responses/Unauthorized
        "403":
          $ref: ./components/common.yaml#/components/responses/Forbidden
        "409":
          $ref: ./components/common.yaml#/components/responses/Conflict
        "413":
          $ref: ./components/common.yaml#/components/responses/PayloadTooLarge
        "422":
          $ref: ./components/common.yaml#/components/responses/ValidationError
        "429":
          $ref: ./components/common.yaml#/components/responses/RateLimited
        "500":
          $ref: ./components/common.yaml#/components/responses/InternalError
        "503":
          $ref: ./components/common.yaml#/components/responses/DependencyUnavailable
      x-aegis-roles:
        - PLATFORM_ADMIN
      x-aegis-backing-action:
        - registry.createTenant
      x-aegis-fr:
        - FR-TEN-01
      x-aegis-error-codes:
        - TENANT_SLUG_TAKEN
        - IDEMPOTENCY_KEY_REUSED
        - UNAUTHORIZED
        - FORBIDDEN
        - DEPENDENCY_UNAVAILABLE
        - INTERNAL_ERROR
        - RATE_LIMITED
        - BAD_REQUEST
        - VALIDATION_ERROR
        - PAYLOAD_TOO_LARGE
  /v1/tenants/{tenantId}:
    get:
      operationId: getTenant
      summary: Get tenant detail and settings
      tags:
        - Tenants
      security:
        - bearerJwt: []
      parameters:
        - name: tenantId
          in: path
          required: true
          description: Tenant UUID.
          schema:
            $ref: ./components/common.yaml#/components/schemas/Uuid
        - $ref: ./components/common.yaml#/components/parameters/XAegisTenant
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    $ref: ./registry.internal.yaml#/components/schemas/Tenant
                  meta:
                    $ref: ./components/common.yaml#/components/schemas/SuccessMeta
        "401":
          $ref: ./components/common.yaml#/components/responses/Unauthorized
        "403":
          $ref: ./components/common.yaml#/components/responses/Forbidden
        "404":
          $ref: ./components/common.yaml#/components/responses/NotFound
        "429":
          $ref: ./components/common.yaml#/components/responses/RateLimited
        "500":
          $ref: ./components/common.yaml#/components/responses/InternalError
        "503":
          $ref: ./components/common.yaml#/components/responses/DependencyUnavailable
      x-aegis-roles:
        - PLATFORM_ADMIN
        - TENANT_ADMIN
      x-aegis-backing-action:
        - registry.getTenantSettings
      x-aegis-fr:
        - FR-TEN-08
      x-aegis-error-codes:
        - NOT_FOUND
        - UNAUTHORIZED
        - FORBIDDEN
        - DEPENDENCY_UNAVAILABLE
        - INTERNAL_ERROR
        - RATE_LIMITED
    patch:
      operationId: updateTenant
      summary: Update tenant settings or status
      description: Settings changes (highValueThresholdUsd, highRiskCountries, retentionDays, demoMode) are allowed for TENANT_ADMIN of the tenant; status changes (ACTIVE/SUSPENDED/DEACTIVATED with reason) are PLATFORM_ADMIN only (otherwise 403).
      tags:
        - Tenants
      security:
        - bearerJwt: []
      parameters:
        - name: tenantId
          in: path
          required: true
          description: Tenant UUID.
          schema:
            $ref: ./components/common.yaml#/components/schemas/Uuid
        - $ref: ./components/common.yaml#/components/parameters/XAegisTenant
        - $ref: ./components/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTenantRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    $ref: ./registry.internal.yaml#/components/schemas/Tenant
                  meta:
                    $ref: ./components/common.yaml#/components/schemas/SuccessMeta
        "400":
          $ref: ./components/common.yaml#/components/responses/BadRequest
        "401":
          $ref: ./components/common.yaml#/components/responses/Unauthorized
        "403":
          $ref: ./components/common.yaml#/components/responses/Forbidden
        "404":
          $ref: ./components/common.yaml#/components/responses/NotFound
        "409":
          $ref: ./components/common.yaml#/components/responses/Conflict
        "413":
          $ref: ./components/common.yaml#/components/responses/PayloadTooLarge
        "422":
          $ref: ./components/common.yaml#/components/responses/ValidationError
        "429":
          $ref: ./components/common.yaml#/components/responses/RateLimited
        "500":
          $ref: ./components/common.yaml#/components/responses/InternalError
        "503":
          $ref: ./components/common.yaml#/components/responses/DependencyUnavailable
      x-aegis-roles:
        - PLATFORM_ADMIN
        - TENANT_ADMIN
      x-aegis-backing-action:
        - registry.updateTenantSettings
        - registry.updateTenantStatus
      x-aegis-fr:
        - FR-TEN-02
        - FR-TEN-03
        - FR-TEN-08
      x-aegis-error-codes:
        - NOT_FOUND
        - CONFLICT
        - UNAUTHORIZED
        - FORBIDDEN
        - DEPENDENCY_UNAVAILABLE
        - INTERNAL_ERROR
        - RATE_LIMITED
        - BAD_REQUEST
        - VALIDATION_ERROR
        - PAYLOAD_TOO_LARGE
  /v1/users:
    get:
      operationId: listUsers
      summary: List users
      tags:
        - Users
      security:
        - bearerJwt: []
      parameters:
        - $ref: ./components/common.yaml#/components/parameters/XAegisTenant
        - $ref: ./components/common.yaml#/components/parameters/Limit
        - $ref: ./components/common.yaml#/components/parameters/Cursor
        - name: role
          in: query
          required: false
          schema:
            $ref: ./registry.internal.yaml#/components/schemas/ListUsersQuery/properties/role
        - name: status
          in: query
          required: false
          schema:
            $ref: ./registry.internal.yaml#/components/schemas/ListUsersQuery/properties/status
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: ./registry.internal.yaml#/components/schemas/User
                  meta:
                    $ref: ./components/common.yaml#/components/schemas/SuccessMeta
        "400":
          $ref: ./components/common.yaml#/components/responses/BadRequest
        "401":
          $ref: ./components/common.yaml#/components/responses/Unauthorized
        "403":
          $ref: ./components/common.yaml#/components/responses/Forbidden
        "422":
          $ref: ./components/common.yaml#/components/responses/ValidationError
        "429":
          $ref: ./components/common.yaml#/components/responses/RateLimited
        "500":
          $ref: ./components/common.yaml#/components/responses/InternalError
        "503":
          $ref: ./components/common.yaml#/components/responses/DependencyUnavailable
      x-aegis-roles:
        - TENANT_ADMIN
        - PLATFORM_ADMIN
      x-aegis-backing-action:
        - registry.listUsers
      x-aegis-fr:
        - FR-TEN-05
      x-aegis-error-codes:
        - UNAUTHORIZED
        - FORBIDDEN
        - DEPENDENCY_UNAVAILABLE
        - INTERNAL_ERROR
