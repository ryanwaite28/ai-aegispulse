components:
  securitySchemes:
    bearerJwt:
      $ref: ./components/common.yaml#/components/securitySchemes/bearerJwt
  schemas:
    IssueClientCredentialsTokenRequest:
      type: object
      additionalProperties: false
      properties:
        clientId:
          $ref: ./registry.internal.yaml#/components/schemas/IssueClientCredentialsTokenInput/properties/clientId
        clientSecret:
          $ref: ./registry.internal.yaml#/components/schemas/IssueClientCredentialsTokenInput/properties/clientSecret
      required:
        - clientId
        - clientSecret
    UpdateUserRequest:
      type: object
      additionalProperties: false
      properties:
        displayName:
          $ref: ./registry.internal.yaml#/components/schemas/UpdateUserInput/properties/displayName
        roles:
          $ref: ./registry.internal.yaml#/components/schemas/UpdateUserInput/properties/roles
        status:
          $ref: ./registry.internal.yaml#/components/schemas/UpdateUserInput/properties/status
      minProperties: 1
      description: Role changes revoke the user refresh tokens; the last active TENANT_ADMIN cannot be removed (409 LAST_TENANT_ADMIN).
    UpdateEntityRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          $ref: ./registry.internal.yaml#/components/schemas/UpdateEntityInput/properties/name
        entityType:
          $ref: ./registry.internal.yaml#/components/schemas/UpdateEntityInput/properties/entityType
        ticker:
          $ref: ./registry.internal.yaml#/components/schemas/UpdateEntityInput/properties/ticker
        lei:
          $ref: ./registry.internal.yaml#/components/schemas/UpdateEntityInput/properties/lei
        country:
          $ref: ./registry.internal.yaml#/components/schemas/UpdateEntityInput/properties/country
        addAliases:
          $ref: ./registry.internal.yaml#/components/schemas/UpdateEntityInput/properties/addAliases
        removeAliases:
          $ref: ./registry.internal.yaml#/components/schemas/UpdateEntityInput/properties/removeAliases
      minProperties: 1
    UpdateWatchlistRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          $ref: ./registry.internal.yaml#/components/schemas/UpdateWatchlistInput/properties/name
        reason:
          $ref: ./registry.internal.yaml#/components/schemas/UpdateWatchlistInput/properties/reason
        severityFloor:
          $ref: ./registry.internal.yaml#/components/schemas/UpdateWatchlistInput/properties/severityFloor
        status:
          $ref: ./registry.internal.yaml#/components/schemas/UpdateWatchlistInput/properties/status
      minProperties: 1
      description: status=PAUSED pauses the watchlist.
    AddWatchlistEntryRequest:
      type: object
      additionalProperties: false
      properties:
        entityId:
          $ref: ./registry.internal.yaml#/components/schemas/AddWatchlistEntryInput/properties/entityId
        note:
          $ref: ./registry.internal.yaml#/components/schemas/AddWatchlistEntryInput/properties/note
      required:
        - entityId
    UpdateWebhookSourceRequest:
      type: object
      additionalProperties: false
      properties:
        displayName:
          $ref: ./ingestion.internal.yaml#/components/schemas/UpdateWebhookSourceInput/properties/displayName
        status:
          $ref: ./ingestion.internal.yaml#/components/schemas/UpdateWebhookSourceInput/properties/status
        trustLevel:
          $ref: ./ingestion.internal.yaml#/components/schemas/UpdateWebhookSourceInput/properties/trustLevel
        allowedAttachmentHosts:
          $ref: ./ingestion.internal.yaml#/components/schemas/UpdateWebhookSourceInput/properties/allowedAttachmentHosts
      minProperties: 1
      description: Trust-level changes are audited (they affect final_severity).
    UpdateConnectorRequest:
      type: object
      additionalProperties: false
      properties:
        url:
          $ref: ./ingestion.internal.yaml#/components/schemas/UpdateConnectorInput/properties/url
        schedule:
          $ref: ./ingestion.internal.yaml#/components/schemas/UpdateConnectorInput/properties/schedule
        category:
          $ref: ./ingestion.internal.yaml#/components/schemas/UpdateConnectorInput/properties/category
        trustLevel:
          $ref: ./ingestion.internal.yaml#/components/schemas/UpdateConnectorInput/properties/trustLevel
        mapping:
          $ref: ./ingestion.internal.yaml#/components/schemas/UpdateConnectorInput/properties/mapping
        status:
          $ref: ./ingestion.internal.yaml#/components/schemas/UpdateConnectorInput/properties/status
      minProperties: 1
    CompleteUploadRequest:
      type: object
      additionalProperties: false
      properties:
        parts:
          $ref: ./files.internal.yaml#/components/schemas/CompleteUploadInput/properties/parts
    OverrideClassificationRequest:
      type: object
      additionalProperties: false
      properties:
        finalSeverity:
          $ref: ./events.internal.yaml#/components/schemas/OverrideClassificationInput/properties/finalSeverity
        sensitivity:
          $ref: ./events.internal.yaml#/components/schemas/OverrideClassificationInput/properties/sensitivity
        justification:
          $ref: ./events.internal.yaml#/components/schemas/OverrideClassificationInput/properties/justification
      required:
        - justification
      anyOf:
        - required:
            - finalSeverity
        - required:
            - sensitivity
      description: Only an analyst override may lower severity (elevate-only rule, PROJECT.md §1.4.3). Sets status OVERRIDDEN; emits classification.overridden.
    AssignCaseRequest:
      type: object
      additionalProperties: false
      properties:
        assigneeUserId:
          $ref: ./cases.internal.yaml#/components/schemas/AssignCaseInput/properties/assigneeUserId
        expectedVersion:
          $ref: ./cases.internal.yaml#/components/schemas/AssignCaseInput/properties/expectedVersion
      required:
        - assigneeUserId
        - expectedVersion
      description: assigneeUserId = null unassigns.
    AddCaseNoteRequest:
      type: object
      additionalProperties: false
      properties:
        body:
          $ref: ./cases.internal.yaml#/components/schemas/AddCaseNoteInput/properties/body
      required:
        - body
    RecordDispositionRequest:
      type: object
      additionalProperties: false
      properties:
        disposition:
          $ref: ./cases.internal.yaml#/components/schemas/RecordDispositionInput/properties/disposition
        rationale:
          $ref: ./cases.internal.yaml#/components/schemas/RecordDispositionInput/properties/rationale
      required:
        - disposition
        - rationale
      description: NEEDS_REVIEW keeps the status and requires a different analyst for the final disposition (four-eyes, 409 CASE_FOUR_EYES_REQUIRED).
    RequestCaseReevaluationRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          $ref: ./cases.internal.yaml#/components/schemas/RequestReevaluationInput/properties/reason
      required:
        - reason
    DiscardDeadLetterRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          $ref: ./events.internal.yaml#/components/schemas/DiscardDeadLetterInput/properties/reason
      required:
        - reason
    UpdateTenantSettingsRequest:
      type: object
      additionalProperties: false
      properties:
