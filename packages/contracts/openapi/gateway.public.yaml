  /v1/stream:
    get:
      operationId: getStream
      summary: Stream pipeline events (SSE)
      description: Server-Sent Events of tenant-scoped projections of `case.*`, `file.status.changed`, `classification.finalized`, `doc.extraction.*` and `risk.evaluation.recorded`. Projections carry ids, type, status, severity and timestamps only (no payload bodies); restricted events are never streamed. Heartbeat comment every 15 s; `id:` is the eventId; max 5 concurrent streams per user (429 STREAM_LIMIT); idle timeout 1 h. Served by the gateway transport; no ServiceAction.
      tags:
        - Streaming
      security:
        - bearerJwt: []
      parameters:
        - name: Last-Event-ID
          in: header
          required: false
          description: Last received event id (the eventId). Accepted for reconnects; gap-filling is best-effort, so clients re-fetch via REST after reconnecting.
          schema:
            type: string
        - $ref: ./components/common.yaml#/components/parameters/XAegisTenant
      responses:
        "200":
          description: Server-Sent Events stream.
          content:
            text/event-stream:
              schema:
                type: string
                description: "SSE frames: `id: <eventId>`, `event: <type>`, `data: <JSON projection>`; `: heartbeat` comments every 15 s."
        "401":
          $ref: ./components/common.yaml#/components/responses/Unauthorized
        "403":
          $ref: ./components/common.yaml#/components/responses/Forbidden
        "429":
          $ref: ./components/common.yaml#/components/responses/RateLimited
        "500":
          $ref: ./components/common.yaml#/components/responses/InternalError
        "503":
          $ref: ./components/common.yaml#/components/responses/DependencyUnavailable
      x-aegis-roles:
        - VIEWER
        - ANALYST
        - TENANT_ADMIN
        - PLATFORM_ADMIN
      x-aegis-backing-action: []
      x-aegis-fr:
        - FR-SSE-01
        - FR-SSE-02
      x-aegis-error-codes:
        - STREAM_LIMIT
        - UNAUTHORIZED
        - FORBIDDEN
        - DEPENDENCY_UNAVAILABLE
        - INTERNAL_ERROR
        - RATE_LIMITED
      x-aegis-gaps:
        - Gateway-local transport route; no §6.2 ServiceAction (FR-SSE-01 owner is gateway transport).
