  /webhooks/{sourceKey}:
    post:
      operationId: submitWebhook
      summary: Submit a signed webhook delivery
      description: "No JWT: authenticity is established by HMAC-SHA256 over `{timestamp}.{deliveryId}.{rawBody}` (raw bytes, before JSON parsing), compared in constant time against the current and previous secret; `application/json` <= 1 MiB; |now - timestamp| <= 300 s; replayed delivery ids return 409. Schema validation (422) happens only after signature verification. A second delivery with the same `{sourceKey}:{externalId}:v{version}` returns 202 with `duplicate: true` and emits nothing. Rejections are logged without the body."
      tags:
        - Webhooks
      security: []
      parameters:
        - name: sourceKey
          in: path
          required: true
          description: Webhook source key.
          schema:
            type: string
            pattern: ^[a-z0-9-]{3,60}$
        - name: X-Aegis-Signature
          in: header
          required: true
          description: "HMAC signature: `v1=<hex>` (HMAC-SHA256 of `{timestamp}.{deliveryId}.{rawBody}` with the source secret). A comma-separated list of `v1=` values is allowed during secret rotation."
          schema:
            type: string
            pattern: ^v1=[0-9a-f]{64}(,v1=[0-9a-f]{64})*$
        - name: X-Aegis-Timestamp
          in: header
          required: true
          description: Unix seconds; must be within +/-300 s of server time.
          schema:
            type: string
            pattern: ^[0-9]{9,12}$
        - name: X-Aegis-Delivery-Id
          in: header
          required: true
          description: Unique delivery id (<= 128 chars); replays return 409.
          schema:
            type: string
            minLength: 1
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarketEventV1"
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    $ref: ./ingestion.internal.yaml#/components/schemas/WebhookAccepted
                  meta:
                    $ref: ./components/common.yaml#/components/schemas/SuccessMeta
        "400":
          $ref: ./components/common.yaml#/components/responses/BadRequest
        "401":
          $ref: ./components/common.yaml#/components/responses/Unauthorized
        "403":
          $ref: ./components/common.yaml#/components/responses/Forbidden
        "404":
          $ref: ./components/common.yaml#/components/responses/NotFound
        "409":
          $ref: ./components/common.yaml#/components/responses/Conflict
        "413":
          $ref: ./components/common.yaml#/components/responses/PayloadTooLarge
        "422":
          $ref: ./components/common.yaml#/components/responses/ValidationError
        "429":
          $ref: ./components/common.yaml#/components/responses/RateLimited
        "500":
          $ref: ./components/common.yaml#/components/responses/InternalError
        "503":
          $ref: ./components/common.yaml#/components/responses/DependencyUnavailable
      x-aegis-roles: []
      x-aegis-backing-action:
        - ingestion.ingestWebhookDelivery
      x-aegis-fr:
        - FR-WHK-02
        - FR-WHK-03
        - FR-WHK-04
        - FR-WHK-05
      x-aegis-error-codes:
        - WEBHOOK_SOURCE_NOT_FOUND
        - WEBHOOK_SIGNATURE_INVALID
        - WEBHOOK_TIMESTAMP_SKEW
        - WEBHOOK_REPLAY_DETECTED
        - TENANT_SUSPENDED
        - DEPENDENCY_UNAVAILABLE
        - INTERNAL_ERROR
        - RATE_LIMITED
        - BAD_REQUEST
        - VALIDATION_ERROR
        - PAYLOAD_TOO_LARGE
