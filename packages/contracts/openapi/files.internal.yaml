openapi: 3.1.0
info:
  title: AegisPulse Files internal API
  version: 1.0.0
  description: |-
    Internal RPC contract for services/files (Node 24 / Fastify): upload lifecycle, downloads, processing lifecycle and sweeps. Operations are POST /internal/v1/{action}; operationId equals the ServiceAction name (PROJECT.md §6.2).

    All operations are `POST /internal/v1/{actionName}` (uniform RPC style) and return the success envelope `{ data, meta }` (PROJECT.md §8.2). Caller allowlists follow PROJECT.md §5.7.4; the service re-verifies the JWT, role and tenant ownership itself (FR-AUTH-06).
servers:
  - url: http://{host}:8082
    description: In-cluster Service (PROJECT.md §5.4 port).
    variables:
      host:
        default: aegispulse-files
tags:
  - name: files
    description: AegisPulse Files internal API
security:
  - bearerJwt: []
x-aegis-consumer-actions:
  - validateFile
paths:
  /internal/v1/initUpload:
    post:
      operationId: initUpload
      summary: Initiate a file upload
      description: "Internal action `files.initUpload`. Requires a JWT: the user token forwarded by the gateway, or a SERVICE token (aud=aegispulse-internal) whose `act[]` includes `initUpload`."
      tags:
        - files
      security:
        - bearerJwt: []
      parameters:
        - $ref: ./components/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InitUploadInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    $ref: "#/components/schemas/InitUploadResult"
                  meta:
                    $ref: ./components/common.yaml#/components/schemas/SuccessMeta
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    $ref: "#/components/schemas/InitUploadResult"
                  meta:
                    $ref: ./components/common.yaml#/components/schemas/SuccessMeta
        "400":
          $ref: ./components/common.yaml#/components/responses/BadRequest
        "401":
          $ref: ./components/common.yaml#/components/responses/Unauthorized
        "403":
          $ref: ./components/common.yaml#/components/responses/Forbidden
        "409":
          $ref: ./components/common.yaml#/components/responses/Conflict
        "413":
          $ref: ./components/common.yaml#/components/responses/PayloadTooLarge
        "422":
          $ref: ./components/common.yaml#/components/responses/ValidationError
        "429":
          $ref: ./components/common.yaml#/components/responses/RateLimited
        "500":
          $ref: ./components/common.yaml#/components/responses/InternalError
        "503":
          $ref: ./components/common.yaml#/components/responses/DependencyUnavailable
      x-aegis-allowed-callers:
        - gateway
      x-aegis-fr:
        - FR-FILE-01
        - FR-FILE-02
        - FR-FILE-03
        - FR-FILE-13
      x-aegis-error-codes:
        - FILE_TYPE_NOT_ALLOWED
        - FILE_TOO_LARGE
        - UPLOAD_RATE_LIMITED
        - STORAGE_QUOTA_EXCEEDED
        - IDEMPOTENCY_KEY_REUSED
        - TENANT_SUSPENDED
        - UNAUTHORIZED
        - FORBIDDEN
        - BAD_REQUEST
        - VALIDATION_ERROR
        - INTERNAL_ERROR
        - DEPENDENCY_UNAVAILABLE
  /internal/v1/completeUpload:
    post:
      operationId: completeUpload
      summary: Complete an upload
      description: |-
        INITIATED -> UPLOADED; emits file.uploaded and file.status.changed. Already completed: idempotent 200 with current status.

        Internal action `files.completeUpload`. Requires a JWT: the user token forwarded by the gateway, or a SERVICE token (aud=aegispulse-internal) whose `act[]` includes `completeUpload`.
