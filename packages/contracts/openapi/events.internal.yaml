openapi: 3.1.0
info:
  title: AegisPulse Events internal API
  version: 1.0.0
  description: |-
    Internal RPC contract for services/events (Node 24 / Fastify): event archive queries, classification override, replay jobs, dead-letter registry and sweeps. Operations are POST /internal/v1/{action}; operationId equals the ServiceAction name (PROJECT.md §6.2).

    All operations are `POST /internal/v1/{actionName}` (uniform RPC style) and return the success envelope `{ data, meta }` (PROJECT.md §8.2). Caller allowlists follow PROJECT.md §5.7.4; the service re-verifies the JWT, role and tenant ownership itself (FR-AUTH-06).
servers:
  - url: http://{host}:8083
    description: In-cluster Service (PROJECT.md §5.4 port).
    variables:
      host:
        default: aegispulse-events
tags:
  - name: events
    description: AegisPulse Events internal API
security:
  - bearerJwt: []
x-aegis-consumer-actions:
  - archiveEvent
  - runAiScan
  - recordDeadLetter
paths:
  /internal/v1/searchEvents:
    post:
      operationId: searchEvents
      summary: Search the event archive
      description: |-
        Restricted events are returned only for COMPLIANCE_AUDITOR with tier = restricted.

        Internal action `events.searchEvents`. Requires a JWT: the user token forwarded by the gateway, or a SERVICE token (aud=aegispulse-internal) whose `act[]` includes `searchEvents`.
      tags:
        - events
      security:
        - bearerJwt: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchEventsQuery"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/EventSummary"
                  meta:
                    $ref: ./components/common.yaml#/components/schemas/SuccessMeta
        "400":
          $ref: ./components/common.yaml#/components/responses/BadRequest
        "401":
          $ref: ./components/common.yaml#/components/responses/Unauthorized
        "403":
          $ref: ./components/common.yaml#/components/responses/Forbidden
        "422":
          $ref: ./components/common.yaml#/components/responses/ValidationError
        "500":
          $ref: ./components/common.yaml#/components/responses/InternalError
        "503":
          $ref: ./components/common.yaml#/components/responses/DependencyUnavailable
      x-aegis-allowed-callers:
        - gateway
      x-aegis-fr:
        - FR-EVT-04
      x-aegis-error-codes:
        - UNAUTHORIZED
        - FORBIDDEN
        - BAD_REQUEST
        - VALIDATION_ERROR
        - INTERNAL_ERROR
        - DEPENDENCY_UNAVAILABLE
  /internal/v1/getEvent:
