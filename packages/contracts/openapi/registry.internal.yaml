components:
  securitySchemes:
    bearerJwt:
      $ref: ./components/common.yaml#/components/securitySchemes/bearerJwt
  schemas:
    TenantStatus:
      type: string
      enum:
        - ACTIVE
        - SUSPENDED
        - DEACTIVATED
    TenantRole:
      type: string
      enum:
        - TENANT_ADMIN
        - ANALYST
        - VIEWER
        - COMPLIANCE_AUDITOR
      description: Tenant-scoped roles assignable to users (PROJECT.md §1.4.6).
    CreateTenantInput:
      type: object
      additionalProperties: false
      properties:
        slug:
          type: string
          pattern: ^[a-z0-9-]{3,40}$
          description: Unique tenant slug.
        displayName:
          type: string
          minLength: 1
          maxLength: 120
        highValueThresholdUsd:
          type: string
          pattern: ^(?=.*[1-9])[0-9]{1,18}(\.[0-9]{1,4})?$
          description: Decimal string, default "50000".
        highRiskCountries:
          type: array
          items:
            type: string
            pattern: ^[A-Z]{2}$
            description: ISO 3166-1 alpha-2.
          uniqueItems: true
        demoMode:
          type: boolean
          default: false
        retentionDays:
          type: integer
          minimum: 30
          maximum: 3650
          default: 400
      required:
        - slug
        - displayName
    Tenant:
      type: object
      properties:
        id:
          $ref: ./components/common.yaml#/components/schemas/Uuid
        slug:
          type: string
          pattern: ^[a-z0-9-]{3,40}$
        displayName:
          type: string
        status:
          $ref: "#/components/schemas/TenantStatus"
        statusReason:
          oneOf:
            - type: string
            - type: "null"
        highValueThresholdUsd:
          type: string
          pattern: ^(?=.*[1-9])[0-9]{1,18}(\.[0-9]{1,4})?$
          description: Decimal string (never a JSON number).
        highRiskCountries:
          type: array
          items:
            type: string
            pattern: ^[A-Z]{2}$
            description: ISO 3166-1 alpha-2.
          uniqueItems: true
        retentionDays:
          type: integer
          minimum: 30
          maximum: 3650
        demoMode:
          type: boolean
        createdAt:
          $ref: ./components/common.yaml#/components/schemas/IsoDateTime
        updatedAt:
          $ref: ./components/common.yaml#/components/schemas/IsoDateTime
      required:
        - id
        - slug
        - displayName
        - status
        - highValueThresholdUsd
        - highRiskCountries
        - retentionDays
        - demoMode
        - createdAt
        - updatedAt
      description: Tenant detail including settings (FR-TEN-08).
    UpdateTenantStatusInput:
      type: object
      additionalProperties: false
      properties:
        tenantId:
          $ref: ./components/common.yaml#/components/schemas/Uuid
        status:
          $ref: "#/components/schemas/TenantStatus"
        reason:
          type: string
          minLength: 1
      required:
        - tenantId
        - status
        - reason
      description: "PLATFORM_ADMIN status change: ACTIVE <-> SUSPENDED, or DEACTIVATED (terminal) (FR-TEN-02/03)."
    GetTenantSettingsInput:
      type: object
      additionalProperties: false
      properties:
        tenantId:
          $ref: ./components/common.yaml#/components/schemas/Uuid
      required:
        - tenantId
    UpdateTenantSettingsInput:
      type: object
      additionalProperties: false
      properties:
        tenantId:
          $ref: ./components/common.yaml#/components/schemas/Uuid
        highValueThresholdUsd:
          type: string
          pattern: ^(?=.*[1-9])[0-9]{1,18}(\.[0-9]{1,4})?$
          description: Decimal string (never a JSON number).
        highRiskCountries:
          type: array
          items:
            type: string
            pattern: ^[A-Z]{2}$
            description: ISO 3166-1 alpha-2.
          uniqueItems: true
        retentionDays:
          type: integer
          minimum: 30
          maximum: 3650
        demoMode:
          type: boolean
      required:
        - tenantId
      minProperties: 2
      description: At least one setting must be supplied (FR-TEN-08).
    LoginInput:
      type: object
      additionalProperties: false
      properties:
        tenantSlug:
          type: string
          pattern: ^[a-z0-9-]{3,40}$
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          minLength: 1
          maxLength: 256
      required:
        - tenantSlug
        - email
        - password
    TokenPair:
      type: object
      properties:
        accessToken:
          type: string
          description: RS256 JWT, TTL 15 min.
        refreshToken:
          type: string
          description: Opaque rotating refresh token, TTL 7 d.
        tokenType:
          type: string
          enum:
            - Bearer
        expiresIn:
          type: integer
          description: Access token lifetime in seconds (900).
        mustChangePassword:
          type: boolean
          description: True until the initial password is changed (FR-TEN-04).
      required:
        - accessToken
        - refreshToken
        - tokenType
        - expiresIn
        - mustChangePassword
    RefreshTokenInput:
      type: object
      additionalProperties: false
      properties:
        refreshToken:
          type: string
          minLength: 1
      required:
        - refreshToken
    LogoutInput:
      type: object
      additionalProperties: false
      properties:
        refreshToken:
          type: string
          minLength: 1
      required:
        - refreshToken
    ChangePasswordInput:
      type: object
      additionalProperties: false
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 256
        newPassword:
          type: string
          minLength: 14
          maxLength: 256
          description: "Policy: >= 14 chars and zxcvbn score >= 3 (FR-TEN-04); violations return 422 AUTH_PASSWORD_POLICY."
      required:
        - currentPassword
        - newPassword
    IssueClientCredentialsTokenInput:
      type: object
      additionalProperties: false
      properties:
        clientId:
          type: string
          minLength: 1
        clientSecret:
          type: string
          minLength: 1
        audience:
          type: string
          enum:
            - aegispulse
            - aegispulse-internal
      required:
        - clientId
        - clientSecret
        - audience
    AccessToken:
      type: object
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          enum:
            - Bearer
        expiresIn:
          type: integer
          description: Seconds (900); no refresh token.
      required:
        - accessToken
        - tokenType
        - expiresIn
    GetCurrentPrincipalInput:
      type: object
      additionalProperties: false
      properties: {}
      description: Empty payload (Record<string, never>).
    Principal:
      type: object
      properties:
        typ:
          type: string
          enum:
            - user
            - service
        id:
          $ref: ./components/common.yaml#/components/schemas/Uuid
        email:
          oneOf:
            - type: string
              format: email
              maxLength: 320
            - type: "null"
        displayName:
          oneOf:
            - type: string
            - type: "null"
        roles:
          type: array
          items:
            $ref: ./components/common.yaml#/components/schemas/Role
        mustChangePassword:
          type: boolean
        tenant:
          oneOf:
            - type: object
              properties:
                id:
                  $ref: ./components/common.yaml#/components/schemas/Uuid
                slug:
                  type: string
                displayName:
                  type: string
                status:
                  $ref: "#/components/schemas/TenantStatus"
              required:
                - id
                - slug
            - type: "null"
      required:
        - typ
        - id
        - roles
        - tenant
      description: "Current principal: profile, tenant, roles (FR-AUTH-03). `tenant` is null for internal SERVICE accounts."
    CreateUserInput:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        displayName:
          type: string
          minLength: 1
        roles:
          type: array
          items:
            $ref: "#/components/schemas/TenantRole"
          minItems: 1
          uniqueItems: true
        initialPassword:
          type: string
          minLength: 14
          maxLength: 256
          description: "Policy: >= 14 chars and zxcvbn score >= 3 (FR-TEN-04); violations return 422 AUTH_PASSWORD_POLICY."
      required:
        - email
        - displayName
        - roles
        - initialPassword
    User:
      type: object
      properties:
        id:
          $ref: ./components/common.yaml#/components/schemas/Uuid
        tenantId:
          $ref: ./components/common.yaml#/components/schemas/Uuid
        email:
          type: string
          format: email
          maxLength: 320
        displayName:
          type: string
        roles:
          type: array
          items:
            $ref: "#/components/schemas/TenantRole"
        status:
          type: string
          enum:
            - ACTIVE
            - DISABLED
        mustChangePassword:
          type: boolean
        lastLoginAt:
          oneOf:
            - $ref: ./components/common.yaml#/components/schemas/IsoDateTime
            - type: "null"
        createdAt:
          $ref: ./components/common.yaml#/components/schemas/IsoDateTime
        updatedAt:
          $ref: ./components/common.yaml#/components/schemas/IsoDateTime
      required:
        - id
        - tenantId
        - email
        - displayName
        - roles
        - status
        - mustChangePassword
        - createdAt
        - updatedAt
    ListUsersQuery:
      type: object
      additionalProperties: false
      properties:
        limit:
          $ref: ./components/common.yaml#/components/schemas/PageQuery/properties/limit
        cursor:
          $ref: ./components/common.yaml#/components/schemas/PageQuery/properties/cursor
        role:
          $ref: "#/components/schemas/TenantRole"
        status:
          type: string
          enum:
            - ACTIVE
            - DISABLED
    UpdateUserInput:
      type: object
      additionalProperties: false
      properties:
        userId:
          $ref: ./components/common.yaml#/components/schemas/Uuid
        displayName:
          type: string
          minLength: 1
        roles:
          type: array
          items:
            $ref: "#/components/schemas/TenantRole"
          minItems: 1
          uniqueItems: true
        status:
          type: string
          enum:
            - ACTIVE
            - DISABLED
      required:
        - userId
      minProperties: 2
      description: Role changes revoke the user refresh tokens; the last active TENANT_ADMIN cannot be removed (409 LAST_TENANT_ADMIN).
    CreateServiceAccountInput:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
      required:
        - name
      description: Creates an INTEGRATION service account (FR-TEN-06).
    ServiceAccount:
      type: object
      properties:
        id:
          $ref: ./components/common.yaml#/components/schemas/Uuid
        tenantId:
          $ref: ./components/common.yaml#/components/schemas/Uuid
        clientId:
          type: string
        name:
          type: string
        kind:
          type: string
          enum:
            - INTEGRATION
        status:
          type: string
          enum:
            - ACTIVE
            - REVOKED
        createdAt:
          $ref: ./components/common.yaml#/components/schemas/IsoDateTime
        updatedAt:
          $ref: ./components/common.yaml#/components/schemas/IsoDateTime
      required:
        - id
        - tenantId
        - clientId
        - name
        - kind
        - status
        - createdAt
    ServiceAccountWithSecret:
      allOf:
        - $ref: "#/components/schemas/ServiceAccount"
        - type: object
          properties:
            clientSecret:
              type: string
              description: 32 random bytes, base64url. Displayed exactly once.
            previousSecretValidUntil:
              oneOf:
                - $ref: ./components/common.yaml#/components/schemas/IsoDateTime
                - type: "null"
              description: "Set on rotation: previous secret remains valid for a 24 h grace period."
          required:
            - clientSecret
    ListServiceAccountsQuery:
      type: object
      additionalProperties: false
      properties:
        limit:
          $ref: ./components/common.yaml#/components/schemas/PageQuery/properties/limit
        cursor:
          $ref: ./components/common.yaml#/components/schemas/PageQuery/properties/cursor
        status:
          type: string
          enum:
            - ACTIVE
            - REVOKED
      description: Responses carry ServiceAccount summaries only; secret material is never returned.
    RotateServiceAccountSecretInput:
      type: object
      additionalProperties: false
      properties:
        serviceAccountId:
          $ref: ./components/common.yaml#/components/schemas/Uuid
      required:
        - serviceAccountId
    RevokeServiceAccountInput:
      type: object
      additionalProperties: false
      properties:
        serviceAccountId:
          $ref: ./components/common.yaml#/components/schemas/Uuid
      required:
        - serviceAccountId
    EntityType:
      type: string
      enum:
        - ORGANIZATION
        - TICKER
        - COUNTERPARTY
        - AGENCY
        - PERSON
    CreateEntityInput:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        entityType:
          $ref: "#/components/schemas/EntityType"
        ticker:
          type: string
          pattern: ^[A-Z.]{1,10}$
        lei:
          type: string
          pattern: ^[A-Z0-9]{20}$
          description: ISO 17442 LEI.
        country:
          type: string
          pattern: ^[A-Z]{2}$
          description: ISO 3166-1 alpha-2.
        aliases:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 200
          uniqueItems: true
      required:
        - name
        - entityType
    Entity:
      type: object
      properties:
        id:
          $ref: ./components/common.yaml#/components/schemas/Uuid
        tenantId:
          $ref: ./components/common.yaml#/components/schemas/Uuid
        name:
          type: string
        normalizedName:
          type: string
        entityType:
          $ref: "#/components/schemas/EntityType"
        ticker:
          oneOf:
            - type: string
              pattern: ^[A-Z.]{1,10}$
            - type: "null"
        lei:
          oneOf:
            - type: string
            - type: "null"
        country:
          oneOf:
            - type: string
              pattern: ^[A-Z]{2}$
              description: ISO 3166-1 alpha-2.
            - type: "null"
        aliases:
          type: array
          items:
            type: string
        archivedAt:
          oneOf:
            - $ref: ./components/common.yaml#/components/schemas/IsoDateTime
            - type: "null"
        createdAt:
          $ref: ./components/common.yaml#/components/schemas/IsoDateTime
        updatedAt:
          $ref: ./components/common.yaml#/components/schemas/IsoDateTime
      required:
        - id
        - tenantId
        - name
        - normalizedName
        - entityType
        - aliases
        - createdAt
        - updatedAt
    EntityDetail:
      allOf:
        - $ref: "#/components/schemas/Entity"
        - type: object
          properties:
            watchlists:
              type: array
              items:
                type: object
                properties:
                  id:
                    $ref: ./components/common.yaml#/components/schemas/Uuid
                  name:
                    type: string
                  status:
                    type: string
                    enum:
                      - ACTIVE
                      - PAUSED
                required:
                  - id
                  - name
                  - status
          required:
            - watchlists
      description: Entity detail + aliases + watchlists.
    GetEntityInput:
      type: object
      additionalProperties: false
      properties:
        entityId:
          $ref: ./components/common.yaml#/components/schemas/Uuid
      required:
        - entityId
    ListEntitiesQuery:
      type: object
      additionalProperties: false
      properties:
        limit:
          $ref: ./components/common.yaml#/components/schemas/PageQuery/properties/limit
        cursor:
          $ref: ./components/common.yaml#/components/schemas/PageQuery/properties/cursor
        q:
          type: string
          minLength: 1
          maxLength: 200
          description: Trigram-similarity search.
        entityType:
          $ref: "#/components/schemas/EntityType"
        watchlistId:
          $ref: ./components/common.yaml#/components/schemas/Uuid
    UpdateEntityInput:
      type: object
      additionalProperties: false
      properties:
        entityId:
          $ref: ./components/common.yaml#/components/schemas/Uuid
        name:
          type: string
          minLength: 1
          maxLength: 200
        entityType:
          $ref: "#/components/schemas/EntityType"
        ticker:
          oneOf:
            - type: string
              pattern: ^[A-Z.]{1,10}$
            - type: "null"
        lei:
          oneOf:
            - type: string
              pattern: ^[A-Z0-9]{20}$
            - type: "null"
        country:
          oneOf:
            - type: string
              pattern: ^[A-Z]{2}$
              description: ISO 3166-1 alpha-2.
            - type: "null"
        addAliases:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 200
        removeAliases:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 200
      required:
        - entityId
      minProperties: 2
    ArchiveEntityInput:
      type: object
      additionalProperties: false
      properties:
        entityId:
          $ref: ./components/common.yaml#/components/schemas/Uuid
      required:
        - entityId
    ResolveEntitiesInput:
      type: object
      additionalProperties: false
      properties:
        tenantId:
          $ref: ./components/common.yaml#/components/schemas/Uuid
        mentions:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 500
        tickers:
          type: array
          items:
            type: string
            pattern: ^[A-Z.]{1,10}$
      required:
        - tenantId
        - mentions
    EntityMatchType:
      type: string
      enum:
        - TICKER_EXACT
        - ALIAS_EXACT
        - NAME_NORMALIZED
        - TRIGRAM
    EntityResolution:
      type: object
      properties:
        mention:
          type: string
        entityId:
          oneOf:
            - $ref: ./components/common.yaml#/components/schemas/Uuid
            - type: "null"
        matchType:
          oneOf:
            - $ref: "#/components/schemas/EntityMatchType"
            - type: "null"
        similarity:
          oneOf:
            - type: number
              minimum: 0
              maximum: 1
            - type: "null"
      required:
        - mention
        - entityId
      description: Unmatched mentions return entityId = null.
    EntityResolutionResult:
      type: object
      properties:
        matches:
          type: array
          items:
            $ref: "#/components/schemas/EntityResolution"
          description: One entry per mention (and per ticker), deterministic for identical inputs (FR-ENT-03). Exact matches first, pg_trgm similarity >= 0.85 last.
      required:
        - matches
    WatchlistStatus:
      type: string
      enum:
        - ACTIVE
        - PAUSED
    CreateWatchlistInput:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        reason:
          type: string
          minLength: 1
        severityFloor:
          $ref: ./components/common.yaml#/components/schemas/Severity
          default: HIGH
        status:
          $ref: "#/components/schemas/WatchlistStatus"
          default: ACTIVE
      required:
        - name
        - reason
    Watchlist:
      type: object
      properties:
        id:
          $ref: ./components/common.yaml#/components/schemas/Uuid
        tenantId:
          $ref: ./components/common.yaml#/components/schemas/Uuid
        name:
          type: string
        reason:
          type: string
        severityFloor:
          $ref: ./components/common.yaml#/components/schemas/Severity
        status:
          $ref: "#/components/schemas/WatchlistStatus"
        entryCount:
          type: integer
          minimum: 0
        createdBy:
          oneOf:
            - $ref: ./components/common.yaml#/components/schemas/Uuid
            - type: "null"
        createdAt:
          $ref: ./components/common.yaml#/components/schemas/IsoDateTime
        updatedAt:
          $ref: ./components/common.yaml#/components/schemas/IsoDateTime
      required:
        - id
        - tenantId
        - name
        - reason
        - severityFloor
        - status
        - createdAt
        - updatedAt
    ListWatchlistsQuery:
      type: object
      additionalProperties: false
      properties:
        limit:
          $ref: ./components/common.yaml#/components/schemas/PageQuery/properties/limit
        cursor:
          $ref: ./components/common.yaml#/components/schemas/PageQuery/properties/cursor
    UpdateWatchlistInput:
      type: object
      additionalProperties: false
      properties:
        watchlistId:
          $ref: ./components/common.yaml#/components/schemas/Uuid
        name:
          type: string
          minLength: 1
          maxLength: 200
        reason:
          type: string
          minLength: 1
        severityFloor:
          $ref: ./components/common.yaml#/components/schemas/Severity
        status:
          $ref: "#/components/schemas/WatchlistStatus"
      required:
        - watchlistId
      minProperties: 2
      description: status=PAUSED pauses the watchlist.
    DeleteWatchlistInput:
      type: object
      additionalProperties: false
      properties:
        watchlistId:
          $ref: ./components/common.yaml#/components/schemas/Uuid
      required:
        - watchlistId
    AddWatchlistEntryInput:
      type: object
      additionalProperties: false
      properties:
        watchlistId:
          $ref: ./components/common.yaml#/components/schemas/Uuid
        entityId:
          $ref: ./components/common.yaml#/components/schemas/Uuid
        note:
          type: string
          maxLength: 2000
      required:
        - watchlistId
        - entityId
    RemoveWatchlistEntryInput:
      type: object
      additionalProperties: false
      properties:
        watchlistId:
          $ref: ./components/common.yaml#/components/schemas/Uuid
        entityId:
          $ref: ./components/common.yaml#/components/schemas/Uuid
      required:
        - watchlistId
        - entityId
    WatchlistEntry:
      type: object
      properties:
        watchlistId:
          $ref: ./components/common.yaml#/components/schemas/Uuid
        entityId:
          $ref: ./components/common.yaml#/components/schemas/Uuid
        note:
          oneOf:
            - type: string
            - type: "null"
        addedBy:
          oneOf:
            - $ref: ./components/common.yaml#/components/schemas/Uuid
            - type: "null"
        createdAt:
          $ref: ./components/common.yaml#/components/schemas/IsoDateTime
      required:
        - watchlistId
        - entityId
        - createdAt
    CounterpartyRef:
      type: object
      additionalProperties: false
      properties:
        counterpartyId:
          type: string
          minLength: 1
          maxLength: 64
        counterpartyName:
          type: string
          minLength: 1
          maxLength: 200
      required:
        - counterpartyId
    CheckWatchlistsInput:
      type: object
      additionalProperties: false
      properties:
        tenantId:
          $ref: ./components/common.yaml#/components/schemas/Uuid
        entityIds:
          type: array
          items:
            $ref: ./components/common.yaml#/components/schemas/Uuid
        counterpartyRefs:
          type: array
          items:
            $ref: "#/components/schemas/CounterpartyRef"
      required:
        - tenantId
      anyOf:
        - required:
            - entityIds
        - required:
            - counterpartyRefs
      description: Provide entityIds and/or counterpartyRefs.
    WatchlistHit:
      type: object
      properties:
        watchlistId:
          $ref: ./components/common.yaml#/components/schemas/Uuid
        watchlistName:
          type: string
        severityFloor:
          $ref: ./components/common.yaml#/components/schemas/Severity
        entityId:
          $ref: ./components/common.yaml#/components/schemas/Uuid
        counterpartyId:
          oneOf:
            - type: string
            - type: "null"
      required:
        - watchlistId
        - watchlistName
        - severityFloor
        - entityId
    WatchlistCheckResult:
      type: object
      properties:
        hits:
          type: array
          items:
            $ref: "#/components/schemas/WatchlistHit"
          description: Hits against ACTIVE watchlists only.
      required:
        - hits
