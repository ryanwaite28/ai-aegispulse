openapi: 3.1.0
info:
  title: AegisPulse Cases internal API
  version: 1.0.0
  description: |-
    Internal RPC contract for services/cases (Java 25 / Spring Boot): risk evaluations, case state machine, evidence, dispositions and the immutable audit log. Operations are POST /internal/v1/{action}; operationId equals the ServiceAction name (PROJECT.md §6.2).

    All operations are `POST /internal/v1/{actionName}` (uniform RPC style) and return the success envelope `{ data, meta }` (PROJECT.md §8.2). Caller allowlists follow PROJECT.md §5.7.4; the service re-verifies the JWT, role and tenant ownership itself (FR-AUTH-06).
servers:
  - url: http://{host}:8085
    description: In-cluster Service (PROJECT.md §5.4 port).
    variables:
      host:
        default: aegispulse-cases
tags:
  - name: cases
    description: AegisPulse Cases internal API
security:
  - bearerJwt: []
x-aegis-consumer-actions:
  - ingestAuditEvent
paths:
  /internal/v1/recordRiskEvaluation:
    post:
      operationId: recordRiskEvaluation
      summary: Record a risk evaluation
      description: |-
        201 on first record; 200 when the idempotencyKey was already recorded. A SUSPENDED tenant gets the evaluation recorded with the case suppressed (suppressedReason = TENANT_SUSPENDED), not an error.

        Internal action `cases.recordRiskEvaluation`. Requires a JWT: the user token forwarded by the gateway, or a SERVICE token (aud=aegispulse-internal) whose `act[]` includes `recordRiskEvaluation`.
      tags:
        - cases
      security:
        - bearerJwt: []
      parameters:
        - $ref: ./components/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordRiskEvaluationInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    $ref: "#/components/schemas/RiskEvaluation"
                  meta:
                    $ref: ./components/common.yaml#/components/schemas/SuccessMeta
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    $ref: "#/components/schemas/RiskEvaluation"
                  meta:
                    $ref: ./components/common.yaml#/components/schemas/SuccessMeta
        "400":
          $ref: ./components/common.yaml#/components/responses/BadRequest
        "401":
          $ref: ./components/common.yaml#/components/responses/Unauthorized
        "403":
          $ref: ./components/common.yaml#/components/responses/Forbidden
        "422":
          $ref: ./components/common.yaml#/components/responses/ValidationError
        "500":
          $ref: ./components/common.yaml#/components/responses/InternalError
        "503":
          $ref: ./components/common.yaml#/components/responses/DependencyUnavailable
      x-aegis-allowed-callers:
        - orchestrator
      x-aegis-fr:
        - FR-TXN-05
        - FR-CASE-01
      x-aegis-error-codes:
        - TENANT_SUSPENDED
        - UNAUTHORIZED
        - FORBIDDEN
        - BAD_REQUEST
        - VALIDATION_ERROR
        - INTERNAL_ERROR
        - DEPENDENCY_UNAVAILABLE
  /internal/v1/openCase:
    post:
      operationId: openCase
      summary: Open a case
      description: |-
        201 when created; 200 when an existing case matches (tenant_id, openIdempotencyKey). New cases enter OPEN then ENRICHING automatically.

        Internal action `cases.openCase`. Requires a JWT: the user token forwarded by the gateway, or a SERVICE token (aud=aegispulse-internal) whose `act[]` includes `openCase`.
      tags:
        - cases
      security:
        - bearerJwt: []
      parameters:
        - $ref: ./components/common.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenCaseInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - meta
                properties:
                  data:
                    $ref: "#/components/schemas/Case"
                  meta:
                    $ref: ./components/common.yaml#/components/schemas/SuccessMeta
        "201":
