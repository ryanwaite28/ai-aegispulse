apiVersion: apps/v1
kind: Deployment
metadata: { name: aegispulse-gateway }
spec:
  replicas: 2
  template:
    spec:
      containers:
        - name: gateway
          resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { cpu: 500m, memory: 384Mi } }
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: aegispulse-postgres }
spec:
  template:
    spec:
      nodeSelector: { dedicated: storage }
      containers:
        - name: postgres
          resources: { requests: { cpu: 250m, memory: 512Mi }, limits: { cpu: "1", memory: 1536Mi } }
